<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado</title>
<script>/* Tema claro/escuro — roda no <head> para evitar "flash" de tema errado */
/* Prova encerrada: vale a partir do horário informado (hora local do navegador, formato AAAA-MM-DDTHH:MM) */
window.examEnded = function (iso) {
  var d = iso && new Date(iso);
  return !!d && !isNaN(d) && Date.now() >= d.getTime();
};
(function () {
  var K = "sim_theme", root = document.documentElement, t = null;
  try { t = localStorage.getItem(K); } catch (e) {}
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  root.setAttribute("data-theme", t);
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest("[data-theme-toggle]")) return;
    var n = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", n);
    try { localStorage.setItem(K, n); } catch (e) {}
  });
})();
</script>
<style>/* ---------- tokens ---------- */
:root{
  --accent:#4f46e5;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --bg:#fbfbfa;--surface:#ffffff;--soft:#f4f4f2;
  --ink:#141416;--ink2:#3d3d45;--muted:#74747e;
  --line:#e9e9e6;--line2:#d6d6d2;
  --ok:#15803d;--ok-bg:#f1faf4;--no:#b42318;--no-bg:#fef3f2;
  --accent-fg:var(--accent);
  --radius:12px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0c0c0e;--surface:#141417;--soft:#1b1b1f;
  --ink:#f3f3f5;--ink2:#cfcfd6;--muted:#8d8d98;
  --line:#25252b;--line2:#35353d;
  --ok:#4ade80;--ok-bg:#0e2217;--no:#f87171;--no-bg:#2a1315;
  --accent-fg:color-mix(in srgb,var(--accent) 62%,#fff);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
a{color:inherit}
h1,h2,h3{letter-spacing:-.015em;margin:0}
.wrap,.in{max-width:900px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:14px;height:56px}
.back{color:var(--muted);text-decoration:none;font-size:.875rem;white-space:nowrap}
.back:hover{color:var(--ink)}
.brand{font-weight:650;letter-spacing:-.01em}
nav.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;height:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;font-weight:500;padding:0 12px;cursor:pointer;white-space:nowrap;position:relative;height:100%}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent-fg);border-radius:2px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;flex:none;margin-left:auto}
.icon-btn:hover{border-color:var(--line2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .i-sun{display:none}
html[data-theme="dark"] .icon-btn .i-sun{display:block}
html[data-theme="dark"] .icon-btn .i-moon{display:none}
nav.tabs + .icon-btn{margin-left:0}

/* ---------- topo da página ---------- */
.hero{padding:44px 0 8px}
.hero h1{font-size:clamp(1.65rem,3.6vw,2.3rem);font-weight:650;line-height:1.15}
.hero p{margin:10px 0 0;color:var(--muted);max-width:62ch}
.hero p.sub{font-size:.9rem;margin-top:8px}
.hero p.lead{color:var(--ink2);font-size:1.05rem;line-height:1.6;margin-top:14px}
main{max-width:900px;margin:0 auto;padding:24px 20px 96px}
#app>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}html{scroll-behavior:auto}}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card h2{font-size:1.05rem;font-weight:620;margin-bottom:12px}
.card h3{font-size:.95rem;font-weight:620;margin:20px 0 8px}
.label{font-size:.72rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.callout{border-left:2px solid var(--line2);padding:2px 0 2px 16px;margin:16px 0 0;color:var(--ink2);font-size:.93rem}

.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:0}
.stats>div{padding:20px 24px}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:1.9rem;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.85rem}
@media (max-width:560px){.stats>div{padding:16px 14px}.stats b{font-size:1.4rem}}

/* ---------- botões ---------- */
.btn{background:var(--accent);color:#fff;border:1px solid transparent;border-radius:9px;padding:10px 18px;font:inherit;font-size:.92rem;font-weight:550;cursor:pointer;transition:opacity .15s,transform .05s}
html[data-theme="dark"] .btn{background:color-mix(in srgb,var(--accent) 78%,#fff);color:#0c0c0e}
.btn:hover{opacity:.9}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
html[data-theme="dark"] .btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink2);opacity:1}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}

/* ---------- mapa de prioridade ---------- */
table.topics{width:100%;border-collapse:collapse}
table.topics th{font-size:.7rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
table.topics td{padding:16px 12px 16px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.topics tr:last-child td{border-bottom:0;padding-bottom:0}
table.topics td:last-child,table.topics th:last-child{padding-right:0;text-align:right}
.tname{font-weight:600}
.twhy{color:var(--muted);font-size:.85rem;margin-top:2px}
.src{display:inline-block;font-size:.72rem;font-weight:550;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:0 8px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.src.focus{color:var(--accent-fg);border-color:var(--accent-fg)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.lvl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.lvl.hot{--c:#e5484d}.lvl.high{--c:#e9a23b}.lvl.mid{--c:#4c8bf5}.lvl.low{--c:var(--muted)}
.bar2{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;min-width:96px}
.bar2 i{display:block;height:100%;background:var(--accent-fg);border-radius:99px}
.bar2.acc i{background:var(--ok)}
.bar2.bad i{background:var(--no)}
.pct{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:640px){table.topics .hide-s{display:none}}

/* seções soltas (fora de cartão), como no index */
.sec{margin:36px 0 14px}
.sec h2{font-size:1.05rem;font-weight:620}
.sec p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.notice{border:1px solid var(--line);border-left:3px solid var(--accent-fg);border-radius:var(--radius);background:var(--surface);padding:16px 20px;margin-bottom:16px;color:var(--ink2);font-size:.95rem}

.notice.resume{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

/* fluxo contínuo: aviso de novo assunto, atalhos entre assuntos, sair/encerrar */
.newtopic{border-left:3px solid var(--accent-fg);background:var(--soft);border-radius:10px;padding:14px 18px;margin:0 0 18px}
.newtopic .label{color:var(--accent-fg);display:block;margin-bottom:2px}
.newtopic>b{display:block;font-size:1.08rem;font-weight:620;letter-spacing:-.01em}
.newtopic .small b{font-weight:600;color:var(--ink2)}
.segs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 0 10px;scrollbar-width:thin}
.segchip{flex:none;display:inline-flex;align-items:center;gap:8px;max-width:210px;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 11px;font:inherit;font-size:.78rem;font-weight:500;cursor:pointer;white-space:nowrap}
.segchip span{overflow:hidden;text-overflow:ellipsis}
.segchip i{font-style:normal;font-variant-numeric:tabular-nums;opacity:.8}
.segchip:hover{border-color:var(--line2);color:var(--ink)}
.segchip.on{border-color:var(--accent-fg);color:var(--ink)}
.segchip.done{color:var(--ok)}
.endrow{text-align:center;margin-top:16px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}

/* assuntos em cartões (mesma linguagem dos cartões do index) */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:700px){.tgrid{grid-template-columns:1fr}}
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;cursor:pointer;transition:border-color .15s,transform .15s}
.tcard:hover,.tcard:focus-visible{border-color:var(--line2);transform:translateY(-2px);outline:none}
.tcard.focus{border-color:color-mix(in srgb,var(--accent-fg) 55%,var(--line))}
.tcard .tc-top{display:flex;justify-content:space-between;align-items:center}
.tcard h3{font-size:1.05rem;font-weight:620;margin:6px 0 0;line-height:1.3}
.tcard .twhy{margin:0;font-size:.88rem}
.tcard .tc-src{display:flex;gap:6px;flex-wrap:wrap}
.tcard .tc-src .src{margin:0}
.tcard .bar2{margin-top:10px}
.tcard .tc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.82rem;color:var(--muted)}
.tcard .go{color:var(--accent-fg);font-weight:600}
.details-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 22px;margin-top:28px}
.details-card details{margin:0}
.details-card p{color:var(--ink2);font-size:.92rem;margin:10px 0 0 14px}

/* ---------- configuração do simulado ---------- */
.opt-row{display:flex;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;align-items:flex-start;background:var(--surface);transition:border-color .15s,background .15s}
.opt-row:hover{border-color:var(--line2)}
.opt-row.on{border-color:var(--accent-fg);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.opt-row input{margin-top:4px;accent-color:var(--accent)}
.opt-row b{font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--ink2);margin:8px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
select{font:inherit;font-size:.9rem;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);margin-top:8px}

/* ---------- questão ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 20px}
.progress i{display:block;height:100%;background:var(--accent-fg);transition:width .3s}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:.75rem;font-weight:550;color:var(--ink2);background:var(--soft);border-radius:6px;padding:2px 9px}
.qtext{font-size:1.1rem;font-weight:550;line-height:1.5;margin:0 0 16px;letter-spacing:-.005em}
.opt{display:flex;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin:8px 0;font:inherit;font-size:.97rem;cursor:pointer;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not(.lock){border-color:var(--line2);background:var(--soft)}
.opt .l{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-size:.72rem;font-weight:650;color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--accent-fg);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.opt.sel .l{background:var(--accent-fg);border-color:var(--accent-fg);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.no{border-color:var(--no);background:var(--no-bg)}
.opt.no .l{background:var(--no);border-color:var(--no);color:var(--bg)}
.opt.lock{cursor:default}

/* feedback */
.fb{margin-top:22px}
.why{border-left:2px solid var(--c);padding:2px 0 2px 16px;margin:16px 0}
.why .label{color:var(--c);display:block;margin-bottom:4px}
.why p{margin:0;color:var(--ink2)}
.why.good{--c:var(--ok)}
.why.bad{--c:var(--no)}
.why .ans{font-weight:600;color:var(--ink);margin-bottom:6px}
.an{background:var(--soft);border-radius:10px;padding:14px 16px;margin:16px 0;color:var(--ink2);font-size:.95rem}
.an .label{display:block;margin-bottom:4px}

/* código */
pre.code{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:14px 16px;overflow:auto;font:.84rem/1.6 var(--mono);margin:12px 0;white-space:pre;tab-size:4}
code{background:var(--soft);color:var(--ink);padding:1px 6px;border-radius:5px;font:.88em var(--mono);border:1px solid var(--line)}
pre.code code{background:none;border:0;padding:0}

details{margin:10px 0}
details>summary{cursor:pointer;font-size:.9rem;font-weight:550;color:var(--ink2);list-style:none;display:flex;gap:8px;align-items:baseline}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);flex:none;transition:transform .15s;margin-right:2px;position:relative;top:-1px}
details[open]>summary::before{transform:rotate(45deg)}
details>summary:hover{color:var(--ink)}
details ul{margin:.6rem 0 0 6px;padding-left:16px;color:var(--ink2);font-size:.92rem}
details ul li{margin:.5rem 0}
.list{padding-left:20px;margin:0;color:var(--ink2)}
.list li{margin:.5rem 0}

/* ---------- resultado ---------- */
.score{font-size:3.4rem;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.rev>details{padding:14px 0;border-top:1px solid var(--line);margin:0}
.rev>details:first-of-type{border-top:0}

/* ---------- hub (index) ---------- */
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}
@media (max-width:700px){.subjects{grid-template-columns:1fr}}
a.subject{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;transition:border-color .15s,transform .15s}
a.subject:hover{border-color:var(--line2);transform:translateY(-2px)}
a.subject .top{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);font-weight:550}
a.subject .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
a.subject h2{font-size:1.2rem;font-weight:620;margin:6px 0 0}
a.subject .desc{color:var(--muted);font-size:.9rem}
a.subject .most{font-size:.86rem;color:var(--ink2);margin-top:8px}
a.subject .most b{font-weight:600}
a.subject .prog{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
a.subject .prog i{display:block;height:100%;width:0;background:var(--c);border-radius:99px}
a.subject.done{opacity:.72}
a.subject.done .top .when{color:var(--ink2)}
a.subject.done .dot{background:var(--muted)}
a.subject .status{font-size:.8rem;color:var(--muted);margin-top:8px}
.howto{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.9rem;max-width:68ch}
.howto b{color:var(--ink2);font-weight:600}
</style></head>
<body>
<header class="bar"><div class="in"><a class="back" href="index.html">&larr; Matérias</a>
<nav class="tabs" id="tabs"></nav>
<button class="icon-btn" data-theme-toggle aria-label="Alternar modo claro e escuro" title="Alternar modo claro/escuro"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<div class="hero"><div class="in"><h1 id="h-title"></h1><p class="sub" id="h-sub"></p><p class="lead" id="h-intro"></p></div></div>
<main id="app"></main>
<script>window.EXAM = {
  id: "ed",
  title: "Estrutura de Dados II",
  subtitle: "Prof. Luiz Guilherme Spolador · Ordenação + Ponteiros + Alocação dinâmica",
  exam: "01/12",
  examEnd: "2026-12-01T20:30",
  color: "#4f46e5",
  intro: "Banco de 50 questões montado em cima das Aulas 5, 6, 7 e 8 (Bubble/Selection, Ponteiros e malloc, Insertion/Merge, Quick). As questões de código usam os mesmos exemplos dos slides (vetor 23, 4, 67, -8, 21...).",
  notice: "**Comece por:** alocação dinâmica, Quick Sort, ponteiros e complexidade dos algoritmos. São os assuntos com maior chance de cair.",
  disclaimer: "**Como estimei a “chance de cair”:** peso dado pelo professor no slide (quantidade de slides, se tem código/teste de mesa, se tem slide de resumo) + aulas mais recentes + o que é cobrado em provas de ED de outras instituições (teste de mesa, complexidade, ponteiros e malloc). É uma estimativa, não garantia. Não achei provas antigas da Multivix publicadas.",
  topics: [
    { id: "conc", name: "Conceitos de ordenação", prob: 60, why: "Chave, interna x externa, **estável** x não estável. Slides curtos, mas estabilidade é pergunta clássica." },
    { id: "bubble", name: "Bubble Sort", prob: 80, why: "Tem código + teste de mesa + complexidade. Fácil de cobrar passo a passo." },
    { id: "sel", name: "Selection Sort", prob: 75, why: "Código + teste de mesa. Ênfase: **sempre O(N²)**, não depende da ordem." },
    { id: "ins", name: "Insertion Sort", prob: 75, why: "Analogia das cartas, estável, online, melhor caso O(N)." },
    { id: "merge", name: "Merge Sort", prob: 80, why: "Dividir para conquistar, O(N log N) em todos os casos, gasta memória extra." },
    { id: "quick", name: "Quick Sort", prob: 90, why: "Aula mais recente e mais longa (15 slides). Pivô, partição, pior caso O(N²), não estável." },
    { id: "comp", name: "Comparação / complexidade", prob: 90, why: "Todo slide de algoritmo fecha com complexidade. Pergunta de “qual é melhor” é quase certa." },
    { id: "ptr", name: "Ponteiros: básico", prob: 90, why: "&, *, declaração, por que têm tipo. Base de tudo — e tem exemplo em código." },
    { id: "arit", name: "Ponteiros: aritmética, vetores e matrizes", prob: 75, why: "p++ avança o tamanho do tipo; vetor = ponteiro constante; matriz é bloco contínuo." },
    { id: "struct", name: "Ponteiros: struct, ** e passagem por referência", prob: 80, why: "Operador ->, swap errado x certo (passagem por valor x referência), níveis de indireção." },
    { id: "alloc", name: "Alocação dinâmica", prob: 92, why: "Aula 6 inteira + slide-resumo no fim. malloc, calloc, realloc, free, sizeof, memory leak." }

    ["conc", "Considere os dados `5a, 2, 5b, 3, 4, 1`, em que 5a e 5b têm a mesma chave (valor 5). Qual resultado representa uma ordenação **estável** em ordem crescente?",

    ["conc", "Em um algoritmo de ordenação, a “chave de ordenação” é:",

    ["bubble", "Dado V = {23, 4, 67, -8, 21}, qual o vetor ao final da **primeira passagem** do `for` interno do bubble sort (ordem crescente)?",
      ["4, 23, -8, 21, 67", "-8, 4, 21, 23, 67", "-8, 4, 67, 23, 21", "4, 23, 67, -8, 21", "4, 23, -8, 67, 21"], 0,
      "Compara pares vizinhos: 23>4 troca → 4,23,67,-8,21; 23<67 mantém; 67>-8 troca; 67>21 troca. Resultado: **4, 23, -8, 21, 67**. O maior (67) “flutuou” até o fim. Ainda faltam passagens.",
      "Bolhas na água: a maior sobe até o topo na primeira rodada; as outras só sobem um pouquinho.",
      ["", "É o vetor totalmente ordenado — o bubble precisa de várias passagens para chegar lá.", "É o resultado do **selection** após o primeiro passo (troca 23 com -8).", "É o vetor depois de apenas a primeira troca; a passagem continua até o fim.", "É o vetor no meio da passagem: ainda falta a troca 67 ↔ 21 (i = 3)."],
      "void bubbleSort(int *V, int N) {\n  int i, continua, aux, fim = N;\n  do {\n    continua = 0;\n    for (i = 0; i < fim-1; i++) {\n      if (V[i] > V[i+1]) {\n        aux = V[i]; V[i] = V[i+1]; V[i+1] = aux;\n        continua = i;\n      }\n    }\n    fim--;\n  } while (continua != 0);\n}"],

      "Com o vetor já ordenado, a primeira passagem não faz nenhuma troca, `continua` fica 0 e o laço termina: uma passada = **O(N)**. Pior caso (ordem inversa) e caso médio: O(N²).",
      "Conferir uma lista que já está em ordem: você lê tudo uma vez e vai embora, não precisa reorganizar nada.",
      ["Ao menos uma passada completa é necessária para ter certeza de que está ordenado.", "", "N log N é do merge/quick, não do bubble.", "N² é o pior caso e o caso médio, não o melhor.", "Não há busca binária: é preciso ao menos uma passagem por todos os elementos para confirmar que está ordenado."]],
    ["bubble", "Quantas **trocas** o bubble sort realiza para ordenar o vetor {5, 1, 4, 2} em ordem crescente?",

      "Cada troca desfaz exatamente um “par invertido”. Conte os pares desordenados e você sabe as trocas.",
      ["Faltou contar a troca 4↔2 da segunda passagem.", "", "Passou do número de pares invertidos (4).", "Passou do número de pares invertidos (4).", "Menos que o número de pares fora de ordem (5-1, 5-4, 5-2 e 4-2 são 4)."]],
    ["bubble", "No código do bubbleSort, qual o papel do comando `fim--` ao final de cada iteração do `do-while`?",
      ["Reduz a região percorrida, pois o maior elemento da passagem já está no lugar", "Diminui o tamanho do vetor na memória a cada passagem concluída", "Conta quantas trocas foram feitas na passagem, para decidir se o laço continua", "Garante a estabilidade do algoritmo, evitando trocar elementos iguais", "Reinicia a variável `continua` para o próximo ciclo do `do-while`"], 0,
      "A cada passagem o maior valor da parte não ordenada vai para o fim. Esse elemento já está **no lugar definitivo**, então a próxima passagem pode parar um pouco antes (`fim-1`).",

      ["", "O vetor continua do mesmo tamanho; só a parte percorrida diminui.", "Quem sinaliza as trocas é a variável `continua`.", "A estabilidade não depende do `fim--`.", "Quem reinicia `continua` é o `continua = 0` no começo do `do`, e não o `fim--`."],
      "do {\n  continua = 0;\n  for (i = 0; i < fim-1; i++) { ... }\n  fim--;\n} while (continua != 0);"],
    ["bubble", "Qual afirmação descreve corretamente o **Bubble Sort**?",
      ["Divide o vetor ao meio recursivamente e intercala as metades já ordenadas", "Escolhe um pivô e separa os menores à esquerda e os maiores à direita", "Compara pares adjacentes e troca os que estão fora de ordem, levando o maior ao fim", "A cada passo escolhe o menor elemento e o coloca na primeira posição livre", "Insere cada elemento na posição correta da parte já ordenada, à esquerda"], 2,
      "Bubble = comparar **vizinhos** e trocar. A cada passagem o maior valor da porção não ordenada sobe até sua posição final.",

    ["sel", "Dado V = {23, 4, 67, -8, 21}, como fica o vetor após o **primeiro passo** (i = 0) do selection sort crescente?",
      ["-8, 4, 67, 23, 21", "4, 23, 67, -8, 21", "-8, 4, 21, 23, 67", "4, 23, -8, 21, 67", "-8, 4, 23, 67, 21"], 0,
      "Para i=0, procura o menor valor de todo o vetor: é -8 (posição 3). Troca V[0] com V[3]: **-8, 4, 67, 23, 21**. O resto fica como estava.",
      "Escolher o melhor jogador para a primeira vaga do time: você olha todos, pega o melhor e o coloca no lugar.",
      ["", "Isso é o resultado da primeira troca do bubble, não do selection.", "Isso seria vários passos adiante.", "É o resultado de uma passagem completa do bubble sort.", "Esse é o resultado do insertion sort ao inserir o -8, não do primeiro passo do selection."],
      "void selectionSort(int *V, int N) {\n  int i, j, menor, troca;\n  for (i = 0; i < N-1; i++) {\n    menor = i;\n    for (j = i+1; j < N; j++)\n      if (V[j] < V[menor]) menor = j;\n    if (i != menor) {\n      troca = V[i]; V[i] = V[menor]; V[menor] = troca;\n    }\n  }\n}"],
    ["sel", "Um vetor com N elementos **já ordenado** é entregue ao selection sort. Qual o tempo de execução?",

      "Mesmo que a turma já esteja em ordem de altura, o professor ainda confere todos para ter certeza de quem é o menor de cada posição.",
      ["O(N) é o melhor caso do bubble/insertion, não do selection.", "Não existe busca binária aqui.", "", "N log N é do merge.", "O selection sempre varre o restante do vetor para achar o menor; o tempo cresce com N."]],
    ["sel", "Usando o código do selectionSort, quantas **trocas** são feitas para o vetor {1, 2, 3, 4, 5}?",

      "if (i != menor) {\n  troca = V[i];\n  V[i] = V[menor];\n  V[menor] = troca;\n}"],
    ["sel", "Bubble sort e selection sort têm a mesma complexidade média O(N²). Segundo a aula, por que na prática o selection sort quase sempre supera o bubble?",
      ["Porque usa recursão para dividir o vetor em partes menores", "Porque sua complexidade média é O(N log N), e não O(N²)", "Porque envolve um número menor de comparações e trocas", "Porque é estável e preserva a ordem de chaves iguais", "Porque usa um array auxiliar para acelerar as trocas"], 2,
      "Segundo o slide: apesar da mesma complexidade no caso médio, o selection “quase sempre supera” o bubble porque envolve **menos operações** (no máximo N-1 trocas). Além disso não usa memória adicional.",

    ["quick", "Para V = {23, 4, 67, -8, 90, 54, 21}, a primeira chamada de `particiona(V, 0, 6)` usa pivô = V[inicio] = 23. Qual o vetor resultante e a posição final do pivô?",
      ["{-8, 4, 21, 23, 90, 54, 67}, pivô na posição 3", "{4, 23, 67, -8, 90, 54, 21}, pivô na posição 1", "{-8, 4, 21, 23, 54, 67, 90}, pivô na posição 3", "{21, 4, -8, 23, 90, 54, 67}, pivô na posição 3", "O vetor não muda e o pivô continua na posição 0"], 0,
      "Esquerda avança enquanto V[esq] ≤ 23 (para no 67); direita recua enquanto V[dir] > 23 (para no 21). Troca 67↔21 → {23,4,21,-8,90,54,67}. Continua: esq para no 90, dir para no -8; esq>dir → fim. Coloca o pivô em dir: V[0]=-8, V[3]=23 → **{-8,4,21,23,90,54,67}**, pivô na posição **3**. Menores à esquerda, maiores à direita (cada lado ainda desordenado).",
      "O pivô é o “juiz”: manda quem é menor para a esquerda e quem é maior para a direita. Ele já fica no lugar definitivo.",
      ["", "Isso é o vetor original quase sem mexer.", "A partição **não** deixa os lados ordenados; isso só acontece depois das chamadas recursivas.", "Os menores não ficam na ordem inversa; o resultado tem {-8, 4, 21} à esquerda.", "O vetor é rearranjado: menores à esquerda, maiores à direita, e o pivô vai para a posição 3."],
      "int particiona(int *V, int inicio, int final) {\n  int esq, dir, pivo, aux;\n  esq = inicio; dir = final;\n  pivo = V[inicio];\n  while (esq < dir) {\n    while (esq <= final && V[esq] <= pivo) esq++;\n    while (dir >= 0 && V[dir] > pivo) dir--;\n    if (esq < dir) { aux = V[esq]; V[esq] = V[dir]; V[dir] = aux; }\n  }\n  V[inicio] = V[dir];\n  V[dir] = pivo;\n  return dir;\n}"],
    ["quick", "Usando o primeiro elemento como pivô, em que situação o Quick Sort apresenta seu **pior caso** O(N²)?",
      ["Quando o vetor contém valores negativos, que desequilibram as comparações com o pivô", "Quando o particionamento é desbalanceado, como em vetor já ordenado (N-1 e 0 elementos)", "Quando o vetor tem tamanho par e as duas partições ficam do mesmo tamanho", "Quando o vetor está em ordem aleatória, pois o pivô cai em posições imprevisíveis", "Quando o vetor tem poucos elementos, pois a recursão não compensa o custo"], 1,
      "Se o pivô é sempre o menor (ou o maior), uma partição fica com N-1 elementos e a outra com 0: a recursão tem N níveis e cada um custa N → **O(N²)**. Um vetor já ordenado provoca isso com pivô no início.",
      "Se o juiz sempre escolhe o aluno mais baixo como referência, ele separa só 1 pessoa por rodada e a turma demora para ser dividida.",
      ["O sinal dos valores não afeta o balanceamento; o que importa é a posição do pivô entre os elementos.", "", "A paridade do tamanho não importa.", "Em ordem aleatória o caso é o médio: O(N log N).", "O pior caso vem de partições de N-1 e 0 elementos repetidas a cada nível, e não do tamanho do vetor."]],
    ["quick", "O que a função `particiona` retorna?",
      ["O maior valor do vetor, que é levado para a última posição", "A posição final do pivô, com os menores à esquerda e os maiores à direita", "O número de trocas realizadas durante a partição do vetor", "O valor do primeiro elemento do vetor, usado como pivô na chamada recursiva seguinte", "O endereço de memória do vetor, para a chamada recursiva"], 1,
      "`particiona` rearranja o vetor em torno do pivô e **devolve a posição em que o pivô ficou**. Essa posição é usada pelo `quickSort` para definir as duas partições.",
      "Depois que o juiz se posiciona, você anota o número da cadeira dele para dividir a turma em duas partes.",
      ["Não retorna o maior valor.", "", "A função não conta trocas.", "O primeiro elemento é o pivô, mas o retorno é a posição final dele.", "Não retorna endereço: retorna o índice em que o pivô ficou."]],
    ["quick", "Após `pivo = particiona(V, inicio, fim)`, quais intervalos o `quickSort` ordena recursivamente?",
      ["[inicio, pivo] e [pivo, fim]", "[inicio, pivo-1] e [pivo+1, fim]", "[inicio, fim] duas vezes", "[pivo+1, fim], deixando a parte esquerda sem ordenar", "[inicio, pivo-1] e [pivo, fim]"], 1,
      "O pivô já está na posição definitiva, por isso fica de fora: chama `quickSort(V, inicio, pivo-1)` e `quickSort(V, pivo+1, fim)`.",
      "Quem já está no lugar certo não entra de novo na confusão.",
      ["Incluiria o pivô de novo (e poderia nunca terminar).", "", "Chamaria sem reduzir o problema — loop infinito.", "Esqueceria a partição da esquerda.", "Incluiria o pivô de novo na segunda partição, e ele já está no lugar certo."],
      "void quickSort(int *V, int inicio, int fim) {\n  int pivo;\n  if (fim > inicio) {\n    pivo = particiona(V, inicio, fim);\n    quickSort(V, inicio, pivo-1);\n    quickSort(V, pivo+1, fim);\n  }\n}"],
    ["quick", "Para um vetor **já ordenado**, com o pivô escolhido no primeiro elemento, qual afirmação é correta?",
      ["Insertion sort é O(N) e Quick sort cai em O(N²)", "Insertion sort e Quick sort ficam em O(N log N)", "Quick sort é O(N) e Insertion sort é O(N²)", "Insertion sort e Quick sort ficam em O(N²)", "Insertion sort é O(N²) e Quick sort é O(N log N)"], 0,
      "O slide diz exatamente isso: o pior caso do Quick ocorre com o array já ordenado (**O(N²)**), situação em que o Insertion é **O(N)**.",
      "Arrumar uma fila que já está em ordem: o Insertion só confere; o Quick (com pivô ruim) refaz tudo sem necessidade.",
      ["", "O O(N log N) vale para o caso médio do Quick, e não para o vetor já ordenado com pivô no início.", "Está invertido.", "O Insertion é O(N) no melhor caso, que é o vetor já ordenado.", "Está invertido: com o vetor já ordenado, o Insertion é O(N) e o Quick (pivô no início) cai em O(N²)."]],
    ["quick", "Apesar de o pior caso ser O(N²), o Quick Sort “costuma ser a melhor opção prática para ordenar grandes conjuntos”. Por quê?",
      ["Porque é estável e preserva a ordem original dos elementos de chaves iguais", "Porque o caso médio e o melhor são O(N log N) e a partição muito desbalanceada é rara", "Porque dispensa a recursão e ordena o vetor com um único laço", "Porque usa menos memória que os demais e faz no máximo N trocas", "Porque divide o vetor em duas metades de tamanho idêntico a cada chamada"], 1,
      "Médio e melhor caso são **O(N log N)** com constantes baixas; o pior caso só ocorre com particionamento desbalanceado, que é situação especial. Por isso é muito rápido na maioria dos casos.",
      "Um carro rápido que só pifa numa estrada muito ruim: no dia a dia ele ganha da concorrência.",
      ["O Quick não é estável.", "", "O Quick é recursivo.", "Isso não é uma propriedade do Quick.", "Isso só acontece com sorte; o pior caso é justamente a divisão desbalanceada."]],

    // ================= COMPARAÇÃO =================
    ["comp", "Qual dos algoritmos abaixo tem complexidade **O(N log N) em todos os casos**?",
      ["Bubble Sort", "Selection Sort", "Insertion Sort", "Merge Sort", "Quick Sort"], 3,
      "Só o Merge Sort mantém O(N log N) independentemente da ordem inicial. Bubble/Insertion variam entre O(N) e O(N²); Selection é sempre O(N²).",
      "Merge é o “regular” da turma: tempo previsível, não importa como os dados chegam.",
      ["Varia de O(N) a O(N²).", "É O(N²) em todos os casos.", "Varia de O(N) a O(N²).", "", "Seu pior caso é O(N²); não é O(N log N) em todos os casos."]],
    ["comp", "Quais algoritmos têm **melhor caso O(N)** quando o vetor já está ordenado?",
      ["Bubble Sort e Insertion Sort", "Selection Sort e Merge Sort", "Merge Sort e Quick Sort", "Selection Sort e Quick Sort", "Bubble Sort e Selection Sort"], 0,
      "Bubble (com `continua`) e Insertion: uma passada sem trocas. Selection é sempre O(N²); Merge é sempre O(N log N); Quick fica O(N log N) no melhor caso.",
      "Dois “conferentes” rápidos: só confirmam que está tudo em ordem.",
      ["", "O Selection é sempre O(N²) e o Merge é sempre O(N log N).", "Nenhum dos dois é O(N) no melhor caso.", "Nenhum dos dois é O(N) no melhor caso.", "O Selection é sempre O(N²), mesmo com o vetor ordenado."]],
    ["comp", "Você precisa de uma ordenação com **garantia** de O(N log N) em qualquer entrada **e** que seja estável, aceitando gastar memória extra. Qual escolher?",
      ["Quick Sort", "Selection Sort", "Merge Sort", "Bubble Sort", "Insertion Sort"], 2,
      "Merge: O(N log N) sempre, estável; custo = array auxiliar. Quick não é estável e pode degradar a O(N²).",
      "Quando você quer previsibilidade e ordem justa (estável), paga o “aluguel” da memória extra.",
      ["Não é estável e tem pior caso O(N²).", "É O(N²) sempre.", "", "É O(N²) no caso médio.", "É estável, mas é O(N²) no caso médio e no pior caso, sem a garantia O(N log N) pedida."]],

    // ================= PONTEIROS: BÁSICO =================
    ["ptr", "Em C, um ponteiro é:",
      ["Uma variável que guarda o endereço de memória de outra variável", "Uma variável que guarda um valor inteiro maior do que o tipo int comporta", "Uma função que acessa diretamente posições da memória do computador", "Um vetor de caracteres usado para guardar textos na memória", "Um tipo de dado que guarda o valor da última variável acessada"], 0,
      "Ponteiros não guardam um valor “comum” (número, caractere): guardam o **endereço** de outra variável. Dizemos que ele “aponta” para ela.",
      "Ponteiro é o papelzinho com o endereço da casa, não a casa.",
      ["", "Ponteiro não guarda valor: guarda endereço.", "Ponteiro não é uma função.", "Vetor de caracteres é uma string.", "Não guarda o último valor acessado; guarda um endereço."]],
    ["ptr", "Qual será a saída do código abaixo?",
      ["10", "15", "5", "Um endereço de memória", "20"], 1,
      "`p` aponta para `x`. `*p = *p + 5` altera o conteúdo apontado: x passa de 10 para 15. O `printf` de `x` imprime **15**.",
      "Você pega o endereço da casa (p), vai até lá (*p) e coloca mais 5 móveis dentro.",
      ["Esse seria o valor antes da alteração.", "", "5 é só o valor somado.", "Só imprimiria endereço se usasse `%p` com `p`.", "Seria o resultado se a soma fosse 10; o código soma 5 ao valor 10."],
      "int x = 10;\nint *p = &x;\n*p = *p + 5;\nprintf(\"%d\", x);"],
    ["ptr", "Por que ponteiros em C têm tipo (`int *`, `char *`, `double *`) se só guardam um endereço?",
      ["Porque o endereço muda de formato conforme o tipo do dado que está sendo apontado", "Porque o tipo informa quantos bytes o dado ocupa, para ler o dado e avançar o ponteiro", "Porque ponteiros de tipos diferentes ficam armazenados em regiões diferentes da memória", "Porque C não permite ponteiros genéricos, então cada tipo precisa de um ponteiro próprio", "Porque o compilador usa o tipo para decidir se o ponteiro pode receber o valor NULL"], 1,
      "O tipo diz **quantos bytes** ler/escrever e **quanto avançar** com `p++`. `char*` sabe que são 1 byte; `int*` geralmente 4.",
      "É como saber se cada “cômodo” mede 1 m ou 4 m para saber quanto andar até o próximo.",
      ["O endereço é sempre um número; o tipo diz respeito ao dado apontado.", "", "Isso não tem a ver com regiões de memória.", "Existe `void *` (ponteiro genérico), como o retorno do malloc.", "A possibilidade de ser NULL não depende do tipo do ponteiro."]],
    ["ptr", "Dados `int idade = 25;` e `int *ptr = &idade;`, qual expressão acessa o **valor 25** através do ponteiro?",
      ["ptr", "&ptr", "*ptr", "&idade", "*idade"], 2,
      "`*ptr` (indireção) acessa o conteúdo no endereço apontado: 25. `ptr` é o endereço de `idade`; `&ptr` é o endereço do próprio ponteiro; `&idade` também é o endereço de `idade`.",
      "`*` = “vá até o endereço e me traga o que está dentro”.",
      ["`ptr` vale o endereço de idade, não 25.", "É o endereço do próprio ponteiro.", "", "É o endereço de idade (igual ao valor de `ptr`).", "`idade` não é um ponteiro; desreferenciar um int é inválido."]],
    ["ptr", "Qual operação **não** é permitida entre dois ponteiros `p1` e `p2`?",
      ["p1 = p2;", "p1 == p2", "p1 < p2", "p1 + p2", "p1 != p2"], 3,
      "Pode atribuir, comparar (==, !=, <, >) e fazer aritmética com inteiros. **Não** dá para somar dois ponteiros, nem multiplicar ou dividir.",
      "Somar o endereço de duas casas não leva a nenhuma casa que faça sentido.",
      ["Atribuição é permitida: p1 passa a apontar para o mesmo lugar.", "Comparação é permitida.", "Comparar posições de memória é permitido.", "", "Comparar ponteiros com `!=` é permitido."]],

    // ================= ARITMÉTICA / VETORES / MATRIZES =================
    ["arit", "Um `int *p` aponta para v[0] e um `int` ocupa 4 bytes. Depois de `p++`, o ponteiro:",
      ["Avança 1 byte, para o endereço seguinte da memória", "Avança 4 bytes, apontando para o próximo elemento int do vetor", "Avança 8 bytes, o tamanho de um ponteiro de 64 bits", "Soma 1 ao valor de v[0], deixando o ponteiro no mesmo lugar", "Avança 4 posições do vetor, para o elemento v[4]"], 1,
      "Aritmética de ponteiros respeita o tipo: `p++` avança **sizeof(tipo)** bytes. int* → 4; double* → 8. Por isso dá para percorrer vetores.",
      "Passos do tamanho do “degrau” do tipo: no `char` o degrau é 1, no `int` é 4.",
      ["Só um char* avança 1 byte.", "", "O passo do `p++` é o tamanho do tipo apontado (int), e não o tamanho do ponteiro.", "Isso seria `(*p)++`; `p++` altera o ponteiro, e não o valor.", "O `p++` avança um elemento (que ocupa 4 bytes), e não quatro elementos."]],
    ["arit", "Dado o código abaixo, qual valor é impresso?",
      ["10", "20", "30", "50", "40"], 2,
      "`p` aponta para v[0]. `p+2` aponta para v[2] e `*(p+2)` é seu conteúdo: **30**. (`p+2` não soma 2 bytes: avança 2 elementos.)",
      "Dois degraus à frente do 10 está o 30.",
      ["Seria *p.", "Seria *(p+1).", "", "Seria *(p+4).", "Seria o valor de *(p+3)."],
      "int v[5] = {10, 20, 30, 40, 50};\nint *p = v;\nprintf(\"%d\", *(p + 2));"],
    ["arit", "Em C, `ptr = vet;` (com `vet` um vetor) é equivalente a:",
      ["ptr = *vet[0];", "ptr = &vet[0];", "ptr = &vet;", "ptr = vet[0];", "ptr = vet + 1;"], 1,
      "O nome de um vetor é, essencialmente, um **ponteiro constante para o seu primeiro elemento**: `vet` ≡ `&vet[0]`.",
      "O nome do vetor é o endereço do “primeiro vagão do trem”.",
      ["`*vet[0]` não faz sentido para int.", "", "Tem tipo diferente (ponteiro para o vetor inteiro).", "`vet[0]` é o valor do primeiro elemento, não o endereço.", "Aponta para o segundo elemento (&vet[1]), não para o primeiro."]],
    ["arit", "Por que, no slide “Eficiência ao zerar uma matriz”, usar um ponteiro (`*ptr = 0; ptr++`) é mais rápido que o laço duplo com `matriz[i][j]`?",
      ["Porque a matriz é guardada em ordem inversa e o ponteiro percorre do fim para o início", "Porque a matriz é um bloco contínuo e o ponteiro só incrementa, sem recalcular matriz[i][j]", "Porque o ponteiro acessa a memória sem verificar os limites, dispensando o laço", "Porque o ponteiro ocupa menos memória do que as variáveis i e j do laço duplo", "Porque os índices i e j exigem acesso ao disco a cada iteração do laço"], 1,
      "Para o computador, uma matriz é um **bloco contínuo** de memória. Percorrer com ponteiro apenas “anda” de elemento em elemento; `matriz[i][j]` exige calcular a posição a cada acesso.",
      "Andar pela rua número a número vs. recalcular o endereço de cada casa pelo mapa toda vez.",
      ["A matriz não é guardada em ordem inversa.", "", "O laço continua existindo (um só, de 2500 elementos).", "O ganho vem de não recalcular o endereço de matriz[i][j] a cada acesso, e não do tamanho das variáveis.", "Os índices são variáveis em memória, e não exigem acesso ao disco."],
      "int matriz[LINS][COLS];\nint *ptr = &matriz[0][0];\nfor (i = 0; i < LINS * COLS; i++) {\n  *ptr = 0;\n  ptr++;\n}"],

    // ================= STRUCT, ** E PASSAGEM POR REFERÊNCIA =================
    ["struct", "Dado `struct Aluno *ptr_aluno;` apontando para uma struct válida, `ptr_aluno->matricula` é equivalente a:",
      ["*ptr_aluno.matricula", "(*ptr_aluno).matricula", "&ptr_aluno.matricula", "ptr_aluno.matricula", "*(ptr_aluno->matricula)"], 1,
      "O operador `->` é um atalho para `(*ponteiro).membro`: primeiro desreferencia (parênteses!), depois acessa o campo.",
      "A seta “->” é a forma curta de dizer “vá até o endereço e pegue este campo”.",
      ["Sem parênteses, `.` tem precedência sobre `*` e a expressão fica errada.", "", "Isso é o endereço do campo.", "Só vale se `ptr_aluno` for a struct, não um ponteiro.", "Tentaria desreferenciar o campo `matricula` (um int), o que é inválido."]],
    ["struct", "O que o programa imprime?",
      ["n1=20 n2=10", "n1=10 n2=20", "n1=0 n2=0", "Erro de compilação", "n1=10 n2=10"], 1,
      "C usa **passagem por valor**: `a` e `b` são cópias. A troca acontece só nas cópias; `n1` e `n2` ficam inalterados: **10 e 20**.",
      "Você manda uma fotocópia dos documentos para alguém trocar de lugar: os originais continuam onde estavam.",
      ["Só trocaria se a função recebesse endereços.", "", "Nada zera as variáveis.", "O código é válido.", "As cópias é que são trocadas; os originais ficam intactos (10 e 20), nada é sobrescrito com o mesmo valor."],
      "void swap_errado(int a, int b) {\n  int temp = a;\n  a = b;\n  b = temp;\n}\nint main() {\n  int n1 = 10, n2 = 20;\n  swap_errado(n1, n2);\n  printf(\"n1=%d n2=%d\", n1, n2);\n}"],
    ["struct", "Dada a função `void swap_correto(int *ptr_a, int *ptr_b)`, como chamá-la para trocar os valores de `n1` e `n2`?",
      ["swap_correto(n1, n2);", "swap_correto(&n1, &n2);", "swap_correto(*n1, *n2);", "swap_correto(n1&, n2&);", "swap_correto(&n1, n2);"], 1,
      "Para modificar variáveis de outra função precisamos passar seus **endereços** (passagem por referência): `&n1` e `&n2`.",
      "Em vez da fotocópia, você entrega o endereço do cofre: a função vai lá e troca o conteúdo original.",
      ["Passaria os valores, não endereços.", "", "`n1` não é ponteiro; `*n1` é inválido.", "Sintaxe inválida.", "Só o primeiro argumento é endereço; o segundo parâmetro é ponteiro e receberia um int."]],
    ["struct", "Dado o código abaixo, qual expressão acessa o valor 100 de `x` usando `pp_x`?",
      ["pp_x", "*pp_x", "**pp_x", "&pp_x", "&&pp_x"], 2,
      "`pp_x` guarda o endereço de `p_x`; `*pp_x` é `p_x` (o endereço de `x`); `**pp_x` é o conteúdo de `x`: **100** (dupla derreferência).",
      "Mapa que leva ao mapa que leva ao tesouro: seguir 2 setas para chegar ao valor.",
      ["É o endereço de `p_x`.", "Isso resulta no endereço de `x` (o valor de `p_x`).", "", "É o endereço do próprio `pp_x`.", "`&&` é o AND lógico; não é “endereço do endereço”."],
      "int x = 100;\nint *p_x = &x;\nint **pp_x = &p_x;"],

    // ================= ALOCAÇÃO DINÂMICA =================
    ["alloc", "Qual a diferença entre alocação estática e dinâmica de memória?",
      ["Estática: tamanho definido na execução; dinâmica: definido na compilação", "Estática: tamanho definido na compilação; dinâmica: solicitado em tempo de execução", "Estática usa malloc e free; dinâmica usa vetores de tamanho fixo", "Estática serve para vetores; dinâmica serve para variáveis simples como int", "Estática guarda os dados no disco; dinâmica guarda os dados na memória RAM"], 1,
      "**Estática** (`char nome[50];`): o compilador reserva tamanho fixo. **Dinâmica**: o programa pede memória enquanto roda (`malloc`...), podendo ajustar o tamanho.",
      "Estática = reservar uma mesa de 50 lugares sem saber quantos convidados vêm. Dinâmica = pedir cadeiras conforme eles chegam.",
      ["Está invertido.", "", "Está invertido: malloc e free fazem parte da alocação dinâmica.", "Ambas servem para vários tipos; o que muda é quando o tamanho é definido.", "As duas usam a memória do programa; a diferença é o momento em que o tamanho é definido."]],
    ["alloc", "Se você declara `char nome[10];` e o usuário digita “Alexandre Magno”, qual é o risco apresentado na aula?",
      ["Desperdício de memória, pois o vetor reservado é muito maior que o texto digitado", "Buffer overflow: escrita além do espaço reservado, sobrescrevendo outras informações", "Memory leak, pois o vetor não é liberado com free ao final do programa", "Erro de compilação, pois o texto digitado excede o tamanho declarado do vetor", "Segmentation fault imediato, interrompendo o programa no momento da digitação"], 1,
      "O texto não cabe nos 10 bytes: o programa escreve além do espaço → **buffer overflow**, que pode corromper outros dados, travar ou virar falha de segurança. (Desperdício é o problema oposto: `nome[100]` para guardar “Ana”.)",
      "Tentar enfiar 15 pessoas num elevador de 10: alguém vai ocupar o espaço que não era dele.",
      ["O desperdício acontece quando o vetor é grande demais, e aqui ele é pequeno demais.", "", "Leak é esquecer de dar `free` em memória dinâmica, e `nome[10]` é alocação estática.", "O compilador não sabe o que o usuário vai digitar.", "O comportamento é indefinido: pode corromper dados sem travar na hora."]],
    ["alloc", "O que a função `malloc()` retorna e o que significa `NULL` nesse contexto?",
      ["Retorna `void *` para o primeiro byte do bloco; `NULL` indica que não há memória disponível", "Retorna `int` com o número de bytes alocados; `NULL` indica que o bloco foi zerado e está pronto para uso", "Retorna `char *` para o bloco; `NULL` indica que a memória já foi liberada", "Retorna `void` (sem valor); `NULL` é usado quando o tamanho pedido é zero", "Retorna `float *` para o bloco; `NULL` indica que o valor armazenado é zero"], 0,
      "`malloc(bytes)` devolve um ponteiro genérico `void*` para o começo do bloco (por isso o cast `(int*)`). Se não houver memória, devolve **NULL** — sempre teste!",
      "Pedir um terreno: ou você recebe a escritura (endereço) ou recebe “nada disponível” (NULL).",
      ["", "O malloc não retorna a quantidade de bytes.", "O retorno é `void *`, e NULL indica falha na alocação, e não memória liberada.", "O malloc retorna um ponteiro, e não void.", "O malloc retorna `void *`, e NULL indica falha na alocação, e não valor zero."],
      "int *v = (int *) malloc(5 * sizeof(int));\nif (v == NULL) {\n  printf(\"Erro na alocacao!\\n\");\n  return 1;\n}"],
    ["alloc", "Qual a principal diferença entre `calloc` e `malloc`?",
      ["`calloc` libera a memória antes de alocar, enquanto `malloc` reserva o bloco", "`calloc` recebe a quantidade e o tamanho de cada elemento e zera todos os bytes do bloco", "`calloc` é restrito a strings, enquanto `malloc` aceita qualquer tipo de dado", "`calloc` é mais lento porque usa recursão para percorrer os elementos do bloco", "`calloc` aloca na pilha (stack), enquanto `malloc` aloca no heap"], 1,
      "`calloc(qtd, sizeof(tipo))` aloca para N elementos **e zera** tudo, evitando “lixo de memória”. Já `malloc` recebe só o total de bytes e não inicializa.",
      "malloc entrega o terreno como está (com entulho). calloc entrega limpo.",
      ["Quem libera memória é o `free`.", "", "O calloc funciona para qualquer tipo.", "Não há recursão envolvida.", "Os dois alocam no heap; a diferença é a inicialização com zero e os argumentos."]],
    ["alloc", "Por que o resultado de `realloc` deve sempre ser **reatribuído** a um ponteiro (ex.: `texto = realloc(texto, 30);`)?",
      ["Porque o `realloc` apaga o conteúdo antigo e o ponteiro precisa receber o novo bloco vazio", "Porque o bloco pode ser movido para outro endereço, se não houver espaço contíguo para crescer", "Porque o `realloc` devolve um int com o novo tamanho, e não o endereço do bloco", "Porque o `realloc` retorna NULL ao aumentar o bloco, e o ponteiro deve guardar esse valor", "Porque o compilador exige reatribuir o ponteiro depois de chamar funções da stdlib"], 1,
      "`realloc` redimensiona **preservando o conteúdo**, mas pode mover o bloco para outro endereço. Se não guardar o novo retorno, você continuará usando o endereço antigo, que já pode ser inválido.",
      "Aumentar o apartamento: se não houver espaço ao lado, você muda para outro maior e leva a mobília. Precisa anotar o endereço novo.",
      ["O conteúdo é preservado.", "", "O `realloc` retorna um ponteiro.", "Só retorna NULL se falhar; do contrário devolve o endereço do bloco, que pode ser outro.", "Não existe essa exigência; a reatribuição é necessária porque o bloco pode mudar de lugar."]],
    ["alloc", "O que acontece no código abaixo?",
      ["Nada de errado: a memória é liberada automaticamente ao fim de cada iteração do laço", "Memory leak: 5 blocos ficam alocados e inacessíveis, pois o ponteiro é perdido sem `free`", "Erro de compilação, pois `malloc` não pode ser chamado dentro de um laço `for`", "O programa trava na segunda iteração, pois o mesmo ponteiro não pode ser alocado duas vezes", "Estouro de pilha (stack overflow), pois cada iteração empilha 1000 inteiros"], 1,
      "Cada iteração aloca um bloco e **perde o ponteiro** `p` ao fim do bloco do `for`, sem `free`. A memória continua ocupada mas inacessível: **vazamento de memória**. Corrigir: `free(p);` no fim de cada volta.",
      "Alugar um depósito e jogar a chave fora: o depósito continua pago, mas ninguém abre.",
      ["C não tem coletor automático: só o `free` libera memória dinâmica.", "", "O `malloc` pode ser chamado dentro de laços.", "O código é válido; o problema é a falta de `free`, que causa o vazamento.", "Os blocos do `malloc` ficam no heap, e não na pilha."],
      "int i;\nfor (i = 0; i < 5; i++) {\n  int *p = (int *) malloc(1000 * sizeof(int));\n  /* usa p... */\n}"],

  cheat: [
    { h: "Ordenação — conceitos", items: [
