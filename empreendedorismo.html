<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado</title>
<script>/* Tema claro/escuro — roda no <head> para evitar "flash" de tema errado */
(function () {
  var K = "sim_theme", root = document.documentElement, t = null;
  try { t = localStorage.getItem(K); } catch (e) {}
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  root.setAttribute("data-theme", t);
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest("[data-theme-toggle]")) return;
    var n = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", n);
    try { localStorage.setItem(K, n); } catch (e) {}
  });
})();
</script>
<style>/* ---------- tokens ---------- */
:root{
  --accent:#4f46e5;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --bg:#fbfbfa;--surface:#ffffff;--soft:#f4f4f2;
  --ink:#141416;--ink2:#3d3d45;--muted:#74747e;
  --line:#e9e9e6;--line2:#d6d6d2;
  --ok:#15803d;--ok-bg:#f1faf4;--no:#b42318;--no-bg:#fef3f2;
  --accent-fg:var(--accent);
  --radius:12px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0c0c0e;--surface:#141417;--soft:#1b1b1f;
  --ink:#f3f3f5;--ink2:#cfcfd6;--muted:#8d8d98;
  --line:#25252b;--line2:#35353d;
  --ok:#4ade80;--ok-bg:#0e2217;--no:#f87171;--no-bg:#2a1315;
  --accent-fg:color-mix(in srgb,var(--accent) 62%,#fff);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
a{color:inherit}
h1,h2,h3{letter-spacing:-.015em;margin:0}
.wrap,.in{max-width:900px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:14px;height:56px}
.back{color:var(--muted);text-decoration:none;font-size:.875rem;white-space:nowrap}
.back:hover{color:var(--ink)}
.brand{font-weight:650;letter-spacing:-.01em}
nav.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;height:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;font-weight:500;padding:0 12px;cursor:pointer;white-space:nowrap;position:relative;height:100%}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent-fg);border-radius:2px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;flex:none;margin-left:auto}
.icon-btn:hover{border-color:var(--line2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .i-sun{display:none}
html[data-theme="dark"] .icon-btn .i-sun{display:block}
html[data-theme="dark"] .icon-btn .i-moon{display:none}
nav.tabs + .icon-btn{margin-left:0}

/* ---------- topo da página ---------- */
.hero{padding:44px 0 8px}
.hero h1{font-size:clamp(1.65rem,3.6vw,2.3rem);font-weight:650;line-height:1.15}
.hero p{margin:10px 0 0;color:var(--muted);max-width:62ch}
.hero p.sub{font-size:.9rem;margin-top:8px}
.hero p.lead{color:var(--ink2);font-size:1.05rem;line-height:1.6;margin-top:14px}
main{max-width:900px;margin:0 auto;padding:24px 20px 96px}
#app>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}html{scroll-behavior:auto}}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card h2{font-size:1.05rem;font-weight:620;margin-bottom:12px}
.card h3{font-size:.95rem;font-weight:620;margin:20px 0 8px}
.label{font-size:.72rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.callout{border-left:2px solid var(--line2);padding:2px 0 2px 16px;margin:16px 0 0;color:var(--ink2);font-size:.93rem}

.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:0}
.stats>div{padding:20px 24px}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:1.9rem;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.85rem}
@media (max-width:560px){.stats>div{padding:16px 14px}.stats b{font-size:1.4rem}}

/* ---------- botões ---------- */
.btn{background:var(--accent);color:#fff;border:1px solid transparent;border-radius:9px;padding:10px 18px;font:inherit;font-size:.92rem;font-weight:550;cursor:pointer;transition:opacity .15s,transform .05s}
html[data-theme="dark"] .btn{background:color-mix(in srgb,var(--accent) 78%,#fff);color:#0c0c0e}
.btn:hover{opacity:.9}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
html[data-theme="dark"] .btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink2);opacity:1}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}

/* ---------- mapa de prioridade ---------- */
table.topics{width:100%;border-collapse:collapse}
table.topics th{font-size:.7rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
table.topics td{padding:16px 12px 16px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.topics tr:last-child td{border-bottom:0;padding-bottom:0}
table.topics td:last-child,table.topics th:last-child{padding-right:0;text-align:right}
.tname{font-weight:600}
.twhy{color:var(--muted);font-size:.85rem;margin-top:2px}
.src{display:inline-block;font-size:.72rem;font-weight:550;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:0 8px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.src.focus{color:var(--accent-fg);border-color:var(--accent-fg)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.lvl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.lvl.hot{--c:#e5484d}.lvl.high{--c:#e9a23b}.lvl.mid{--c:#4c8bf5}.lvl.low{--c:var(--muted)}
.bar2{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;min-width:96px}
.bar2 i{display:block;height:100%;background:var(--accent-fg);border-radius:99px}
.bar2.acc i{background:var(--ok)}
.bar2.bad i{background:var(--no)}
.pct{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:640px){table.topics .hide-s{display:none}}

/* seções soltas (fora de cartão), como no index */
.sec{margin:36px 0 14px}
.sec h2{font-size:1.05rem;font-weight:620}
.sec p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.notice{border:1px solid var(--line);border-left:3px solid var(--accent-fg);border-radius:var(--radius);background:var(--surface);padding:16px 20px;margin-bottom:16px;color:var(--ink2);font-size:.95rem}

.notice.resume{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

/* fluxo contínuo: aviso de novo assunto, atalhos entre assuntos, sair/encerrar */
.newtopic{border-left:3px solid var(--accent-fg);background:var(--soft);border-radius:10px;padding:14px 18px;margin:0 0 18px}
.newtopic .label{color:var(--accent-fg);display:block;margin-bottom:2px}
.newtopic>b{display:block;font-size:1.08rem;font-weight:620;letter-spacing:-.01em}
.newtopic .small b{font-weight:600;color:var(--ink2)}
.segs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 0 10px;scrollbar-width:thin}
.segchip{flex:none;display:inline-flex;align-items:center;gap:8px;max-width:210px;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 11px;font:inherit;font-size:.78rem;font-weight:500;cursor:pointer;white-space:nowrap}
.segchip span{overflow:hidden;text-overflow:ellipsis}
.segchip i{font-style:normal;font-variant-numeric:tabular-nums;opacity:.8}
.segchip:hover{border-color:var(--line2);color:var(--ink)}
.segchip.on{border-color:var(--accent-fg);color:var(--ink)}
.segchip.done{color:var(--ok)}
.endrow{text-align:center;margin-top:16px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}

/* assuntos em cartões (mesma linguagem dos cartões do index) */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:700px){.tgrid{grid-template-columns:1fr}}
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;cursor:pointer;transition:border-color .15s,transform .15s}
.tcard:hover,.tcard:focus-visible{border-color:var(--line2);transform:translateY(-2px);outline:none}
.tcard.focus{border-color:color-mix(in srgb,var(--accent-fg) 55%,var(--line))}
.tcard .tc-top{display:flex;justify-content:space-between;align-items:center}
.tcard h3{font-size:1.05rem;font-weight:620;margin:6px 0 0;line-height:1.3}
.tcard .twhy{margin:0;font-size:.88rem}
.tcard .tc-src{display:flex;gap:6px;flex-wrap:wrap}
.tcard .tc-src .src{margin:0}
.tcard .bar2{margin-top:10px}
.tcard .tc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.82rem;color:var(--muted)}
.tcard .go{color:var(--accent-fg);font-weight:600}
.details-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 22px;margin-top:28px}
.details-card details{margin:0}
.details-card p{color:var(--ink2);font-size:.92rem;margin:10px 0 0 14px}

/* ---------- configuração do simulado ---------- */
.opt-row{display:flex;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;align-items:flex-start;background:var(--surface);transition:border-color .15s,background .15s}
.opt-row:hover{border-color:var(--line2)}
.opt-row.on{border-color:var(--accent-fg);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.opt-row input{margin-top:4px;accent-color:var(--accent)}
.opt-row b{font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--ink2);margin:8px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
select{font:inherit;font-size:.9rem;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);margin-top:8px}

/* ---------- questão ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 20px}
.progress i{display:block;height:100%;background:var(--accent-fg);transition:width .3s}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:.75rem;font-weight:550;color:var(--ink2);background:var(--soft);border-radius:6px;padding:2px 9px}
.qtext{font-size:1.1rem;font-weight:550;line-height:1.5;margin:0 0 16px;letter-spacing:-.005em}
.opt{display:flex;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin:8px 0;font:inherit;font-size:.97rem;cursor:pointer;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not(.lock){border-color:var(--line2);background:var(--soft)}
.opt .l{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-size:.72rem;font-weight:650;color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--accent-fg);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.opt.sel .l{background:var(--accent-fg);border-color:var(--accent-fg);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.no{border-color:var(--no);background:var(--no-bg)}
.opt.no .l{background:var(--no);border-color:var(--no);color:var(--bg)}
.opt.lock{cursor:default}

/* feedback */
.fb{margin-top:22px}
.why{border-left:2px solid var(--c);padding:2px 0 2px 16px;margin:16px 0}
.why .label{color:var(--c);display:block;margin-bottom:4px}
.why p{margin:0;color:var(--ink2)}
.why.good{--c:var(--ok)}
.why.bad{--c:var(--no)}
.why .ans{font-weight:600;color:var(--ink);margin-bottom:6px}
.an{background:var(--soft);border-radius:10px;padding:14px 16px;margin:16px 0;color:var(--ink2);font-size:.95rem}
.an .label{display:block;margin-bottom:4px}

/* código */
pre.code{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:14px 16px;overflow:auto;font:.84rem/1.6 var(--mono);margin:12px 0;white-space:pre;tab-size:4}
code{background:var(--soft);color:var(--ink);padding:1px 6px;border-radius:5px;font:.88em var(--mono);border:1px solid var(--line)}
pre.code code{background:none;border:0;padding:0}

details{margin:10px 0}
details>summary{cursor:pointer;font-size:.9rem;font-weight:550;color:var(--ink2);list-style:none;display:flex;gap:8px;align-items:baseline}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);flex:none;transition:transform .15s;margin-right:2px;position:relative;top:-1px}
details[open]>summary::before{transform:rotate(45deg)}
details>summary:hover{color:var(--ink)}
details ul{margin:.6rem 0 0 6px;padding-left:16px;color:var(--ink2);font-size:.92rem}
details ul li{margin:.5rem 0}
.list{padding-left:20px;margin:0;color:var(--ink2)}
.list li{margin:.5rem 0}

/* ---------- resultado ---------- */
.score{font-size:3.4rem;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.rev>details{padding:14px 0;border-top:1px solid var(--line);margin:0}
.rev>details:first-of-type{border-top:0}

/* ---------- hub (index) ---------- */
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}
@media (max-width:700px){.subjects{grid-template-columns:1fr}}
a.subject{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;transition:border-color .15s,transform .15s}
a.subject:hover{border-color:var(--line2);transform:translateY(-2px)}
a.subject .top{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);font-weight:550}
a.subject .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
a.subject h2{font-size:1.2rem;font-weight:620;margin:6px 0 0}
a.subject .desc{color:var(--muted);font-size:.9rem}
a.subject .most{font-size:.86rem;color:var(--ink2);margin-top:8px}
a.subject .most b{font-weight:600}
a.subject .prog{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
a.subject .prog i{display:block;height:100%;width:0;background:var(--c);border-radius:99px}
a.subject .status{font-size:.8rem;color:var(--muted);margin-top:8px}
.howto{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.9rem;max-width:68ch}
.howto b{color:var(--ink2);font-weight:600}
</style></head>
<body>
<header class="bar"><div class="in"><a class="back" href="index.html">&larr; Matérias</a>
<nav class="tabs" id="tabs"></nav>
<button class="icon-btn" data-theme-toggle aria-label="Alternar modo claro e escuro" title="Alternar modo claro/escuro"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<div class="hero"><div class="in"><h1 id="h-title"></h1><p class="sub" id="h-sub"></p><p class="lead" id="h-intro"></p></div></div>
<main id="app"></main>
<script>window.EXAM = {
  id: "emp",
  title: "Empreendedorismo",
  subtitle: "Prof. Rafael Altoé Frossard · Aulas 1, 2 e 3 + Listas 1, 2 e 3",
  color: "#0f766e",
  intro: "59 questões no formato das listas do professor (enunciado contextualizado, 5 alternativas A–E), cobrindo as três aulas. Mais 4 questões discursivas com resposta-modelo na aba Prática, porque as listas terminam sempre com uma discursiva.",
  notice: "**Foco provável: SWOT.** Comece pelo assunto “SWOT (diagnóstico estratégico)”. **Dica de prova:** as respostas certas quase sempre repetem o texto do slide; as erradas costumam usar “apenas”, “exclusivamente”, “ignorar” ou “evitar”.",
  disclaimer: "**Padrão do professor (pelas 3 listas):** cada lista tem 5 questões objetivas contextualizadas (“Imagine uma empresa brasileira de…”) que testam **a definição exata do slide**, mais 1 discursiva. As respostas certas quase sempre são as que repetem o texto do slide; as erradas costumam usar “apenas”, “ignorar”, “evitar”, “exclusivamente”. Não achei provas antigas da Multivix publicadas; as estimativas de chance vêm do peso de cada tema nos slides e nas listas. As questões de SWOT seguem o modelo clássico de livros de administração (o tema não está nos slides das Aulas 1 a 3, mas é considerado provável de cair); se o professor usou outra nomenclatura, vale a dele.",
  topics: [
    { id: "swot", name: "SWOT (diagnóstico estratégico)", src: "Fora dos slides", focus: true, prob: 92, why: "Indicado como provável de cair. Forças e fraquezas (internas), oportunidades e ameaças (externas), classificar fatores, cruzar quadrantes para formar estratégias e o papel da SWOT no pitch." },
    { id: "oport", name: "Oportunidade e ação empreendedora", prob: 80, why: "Definição de Hisrich e Peters (Lista 1, questão 1). Percepção → avaliação → ação." },
    { id: "pens", name: "Pensamento: estrutural, bricolagem, efetuação", prob: 93, why: "3 das 6 questões da Lista 1. Slide com 3 exemplos (NASA, fazenda de metano, Zé das Couves). **Quase certo.**" },
    { id: "adapt", name: "Mentalidade e adaptabilidade cognitiva", prob: 75, why: "Definição + 4 etapas (conhecimento, conexão, estratégicas, reflexão). Questão 4 da Lista 1." },
    { id: "perfil", name: "Perfil do empreendedor e redes de apoio", prob: 70, why: "Educação, idade (22–45), experiência, modelos de conduta, apoio moral x profissional, sustentável." },
    { id: "intra", name: "Intraempreendedorismo e cultura empreendedora", prob: 96, why: "Lista 2 **inteira** é sobre isso (5 questões + discursiva). Aula 2 inteira. Prioridade máxima." },
    { id: "estrat", name: "Estratégia empreendedora, recursos e conhecimentos", prob: 90, why: "Lista 3 quase inteira: nova entrada, recursos (valiosos/raros/inimitáveis), conhecimento empírico/mercado/tecnológico." },
    { id: "janela", name: "Janela de oportunidade e pioneirismo", prob: 78, why: "Aula 3, slides 9–13: erro de comissão/omissão, vantagens e desvantagens de ser pioneiro." },
    { id: "extra", name: "Bônus: Porter e Balanced Scorecard (fora dos slides)", prob: 30, why: "Não estão nos slides das Aulas 1 a 3, mas o enunciado da AV cita os dois. Só 2 questões, por segurança." }

  plan: [

      "Focado em **preservar natureza, suporte de vida e comunidade** na busca de oportunidades que gerem **ganhos econômicos e não econômicos** (indivíduo, economia e sociedade). Exige conhecer a fundo o meio ambiente.",
      "Negócio que dá lucro para o dono e deixa o rio mais limpo.",
      ["Isso é o oposto: o conceito inclui preservar a natureza e a comunidade.", "", "O conceito inclui ganhos para terceiros e para a sociedade, e não só para o empreendedor.", "Reduzir concorrentes não faz parte do conceito.", "O empreendedorismo sustentável busca criar novos produtos, processos e serviços."]],

    // ========== INTRAEMPREENDEDORISMO ==========
    ["intra", "Na Xerox dos anos 1970, talentos como Steve Jobs sentiam falta de liberdade para inovar e saíram para fundar suas próprias empresas. Qual conceito representa a estratégia de aproveitar as ideias criativas internas para evitar perda de produtividade e de talentos?",
      ["Orientação estratégica, que foca na formulação da estratégia e na minimização de recursos", "Intraempreendedorismo, que cultiva o espírito empreendedor dentro da organização", "Controle de recursos, que prioriza acessar recursos de terceiros em novos negócios", "Filosofia de recompensas, que premia a posição hierárquica ocupada pelo funcionário", "Estrutura administrativa orgânica, que dispensa as redes informais de contatos"], 1,
      "**Intraempreendedorismo** = aproveitar as ideias criativas dos colaboradores, cultivando o espírito empreendedor **dentro** da organização. Sem isso: perda de produtividade ou saída da empresa. (Lista 2, questão 1.)",
      "É dar ao funcionário um “cantinho” para tocar o próprio projeto, para ele não sair e abrir o dele na porta ao lado.",
      ["É uma dimensão da tomada de decisão, e não o conceito de aproveitar as ideias internas.", "", "É uma dimensão da tomada de decisão, e não o conceito de reter talentos com ideias próprias.", "A recompensa deve ser pela contribuição à descoberta e à exploração de oportunidades, e não pela hierarquia.", "A estrutura empreendedora é orgânica e conta com várias redes informais."]],
    ["intra", "Para não perder as ideias de seus funcionários, a Xerox criou a:",
      ["Xerox Innovation Labs, laboratório que desenvolve novas tecnologias de impressão", "Xerox Technology Ventures (XTV), para investir nas ideias dos funcionários", "Xerox Capital Partners, braço de investimentos em empresas externas", "Xerox Spin-off Fund, fundo para apoiar ex-funcionários que abrissem empresas fora da Xerox", "Xerox Creative Division, setor que centraliza as ideias dos executivos"], 1,
      "Depois que Jobs saiu para fundar sua empresa, a Xerox criou a **Xerox Technology Ventures (XTV)**: braço para **investir nas ideias dos funcionários**.",
      "XTV = “X” de Xerox + Ventures: fundo interno para apostar nos funcionários.",
      ["Esse nome não aparece na aula; a unidade criada para investir nas ideias dos funcionários foi a XTV.", "", "Esse nome não aparece na aula; a XTV investia nas ideias dos próprios funcionários.", "A XTV foi criada para manter as ideias dentro da Xerox, e não para apoiar empresas fora dela.", "Esse nome não aparece na aula, e a ideia era valorizar as ideias dos funcionários, e não só dos executivos."]],
    ["intra", "Por que a falta de espaço para expressão individual e de mais liberdade é um problema para as organizações, segundo a Aula 2?",
      ["Reduz a rotatividade, pois os colaboradores se sentem seguros com regras claras", "Desanima os colaboradores e pode gerar perda de produtividade ou saída da empresa", "Aumenta a lucratividade no curto prazo, mas reduz a capacidade de crescimento futuro", "Impede a empresa de fixar metas, já que ninguém propõe objetivos próprios", "Eleva os custos de treinamento, pois os funcionários precisam aprender funções novas"], 1,
      "Muitos querem criar algo “seu” ou buscar **significado maior** no que fazem; se a organização não oferece, o indivíduo **perde motivação ou vai embora**.",
      "Ninguém fica muito tempo num emprego em que não pode propor nada.",
      ["O efeito descrito é o oposto: sem liberdade, os colaboradores se desmotivam e saem.", "", "A aula não aponta ganho de lucratividade; aponta perda de produtividade e de talentos.", "Não é o que o slide diz.", "O problema destacado é a desmotivação e a saída de talentos, e não o custo de treinamento."]],
    ["intra", "Qual alternativa descreve a **orientação empreendedora à oportunidade**, na comparação entre tomada de decisão administrativa e empreendedora?",
      ["Foco nos fatores envolvidos na formulação da estratégia da empresa", "Comprometimento em agir com relação às possíveis oportunidades", "Foco em acessar e controlar os recursos que a empresa já possui", "Foco em crescer de forma gradual, preservando a estrutura existente", "Foco em reduzir riscos antes de assumir compromisso de ação"], 1,
      "Orientação empreendedora à oportunidade = **comprometimento em agir** diante de possíveis oportunidades. A **orientação estratégica** é que foca nos fatores da formulação da estratégia.",
      "Administrador pergunta “o que meu plano prevê?”. Empreendedor pergunta “qual oportunidade eu agarro agora?”.",
      ["Isso é a orientação estratégica.", "", "O slide fala em acessar recursos de terceiros (controle de recursos).", "A orientação empreendedora busca crescimento rápido.", "É o oposto: a orientação empreendedora é de comprometimento em agir."]],
    ["intra", "Na tomada de decisão empreendedora, o **comprometimento de recursos** e o **controle de recursos** referem-se, respectivamente, a:",
      ["Acessar recursos de terceiros / minimizar os recursos necessários para a oportunidade", "Minimizar os recursos necessários para a oportunidade / acessar recursos de terceiros", "Maximizar os recursos próprios / vender os recursos que estão ociosos", "Concentrar capital na empresa / evitar parcerias para manter o controle", "Reduzir a equipe ao mínimo / terceirizar toda a produção"], 1,
      "**Comprometimento de recursos** = como **minimizar** os recursos necessários para uma oportunidade. **Controle de recursos** = como **acessar recursos de terceiros**.",
      "Empreendedor não precisa ser dono do carro: ele aluga, pega emprestado, faz parceria.",
      ["Está invertido.", "", "Não é o conceito apresentado na aula.", "As parcerias são justamente uma forma de acessar recursos de terceiros.", "Não é o conceito apresentado na aula."]],
    ["intra", "Em empresas com mentalidade empreendedora, a **estrutura administrativa** e a **filosofia de recompensas** são, respectivamente:",
      ["Hierárquica, com várias camadas de decisão / recompensa por tempo de casa", "Orgânica, com poucas camadas e redes informais / recompensa pela contribuição às oportunidades", "Orgânica, com poucas camadas e redes informais / recompensa por seguir os processos", "Centralizada, com decisões na alta direção da empresa / recompensa pela contribuição às oportunidades", "Matricial, com chefias duplas e processos formais / recompensa por metas individuais"], 1,
      "**Estrutura orgânica** (menos burocracia entre alta administração e cliente; redes informais) e **recompensa baseada na contribuição** para descobrir/explorar oportunidades.",
      "Time de startup: pouca hierarquia, e o bônus vai para quem trouxe a boa ideia.",
      ["Descreve o modelo administrativo tradicional.", "", "A recompensa por seguir processos não é o critério: é pela contribuição à descoberta e exploração de oportunidades.", "Centralizar decisões é o oposto da estrutura orgânica.", "Não é o modelo apresentado na aula."]],
    ["intra", "A **cultura empreendedora**, segundo a Aula 2, é aquela que:",
      ["Protege a operação, limitando os experimentos aos setores de pesquisa e desenvolvimento", "Estimula os funcionários a gerar ideias e experimentar para criar oportunidades", "Define critérios rígidos para classificar uma oportunidade antes de testá-la", "Concentra as decisões sobre novos projetos em poucos gestores experientes", "Prioriza resultados de curto prazo para provar rapidamente o valor de cada ideia"], 1,
      "Cultura empreendedora = foco em **estimular os funcionários a gerar ideias, experimentos** e outras atividades que possam produzir oportunidades.",
      "Escola que deixa o aluno montar o próprio projeto, em vez de só copiar a lição.",
      ["A cultura empreendedora incentiva experimentos em toda a organização.", "", "Uma das características é justamente não ter parâmetros rígidos de oportunidade.", "A cultura é de equipe, liberdade e apoio, e não de decisões concentradas.", "Um dos traços é o horizonte de longo prazo."]],
    ["intra", "Uma startup brasileira de software, ao crescer, formalizou processos e percebeu que isso inibe a inovação. Qual ação melhor fomenta uma **cultura empreendedora** interna?",
      ["Planejar o curto prazo com metas trimestrais para reduzir a exposição a riscos", "Punir os projetos que fracassam para proteger a eficiência da operação", "Estimular ideias nas fronteiras da tecnologia, com experimentos, tentativa e erro", "Exigir parâmetros rígidos de aprovação para toda oportunidade identificada", "Centralizar as decisões na diretoria para manter o controle dos processos"], 2,
      "Entre as características: opera nas **fronteiras da tecnologia**, estimula novas ideias, **incentiva tentativa e erro**, **permite fracassos**, sem parâmetros rígidos, recursos acessíveis, equipe multidisciplinar, longo prazo, voluntariado, recompensa adequada, patrocinadores e apoio da alta administração. (Lista 2, questão 2.)",
      "Laboratório de pesquisa que aceita que 9 experimentos deem errado para o 10º dar certo.",
      ["O horizonte da cultura empreendedora é de longo prazo.", "Na cultura empreendedora os fracassos são permitidos.", "", "Uma característica é a ausência de parâmetros rígidos de oportunidade.", "A burocracia e a centralização são o oposto da cultura empreendedora."]],
    ["intra", "Qual das alternativas descreve corretamente o **empreendedor corporativo**?",
      ["Prioriza o trabalho individual, centraliza as decisões e evita discussões abertas", "Conhece o ambiente, é visionário e flexível, forma coalizões de patrocinadores e persiste", "Foca em projetos de curto prazo e evita patrocinadores para não dividir o crédito", "Segue as opções administrativas existentes e evita propor mudanças na empresa", "Age isoladamente para proteger a ideia e a apresenta à diretoria quando já está pronta"], 1,
      "As 7 características do slide: **conhece o ambiente; visionário e flexível; cria opções administrativas; encoraja o trabalho em equipe; estimula a discussão aberta; constrói coalizão de patrocinadores; é persistente.** (Lista 2, questão 4.)",
      "Funcionário que vira “embaixador” do seu projeto: conhece a empresa, junta aliados e não desiste.",
      ["O empreendedor corporativo encoraja o trabalho em equipe e estimula a discussão aberta.", "", "Ele constrói uma coalizão de patrocinadores e é persistente, com visão de longo prazo.", "Uma característica é criar opções administrativas.", "Ele constrói uma coalizão de patrocinadores e estimula a discussão aberta, em vez de agir isolado."]],
    ["intra", "Estudos mostram que empreendimentos corporativos têm sucesso **menor** que os iniciados de forma independente. Qual julgamento reflete melhor os problemas identificados?",
      ["O apoio da alta administração torna os empreendimentos corporativos mais lucrativos que os independentes do mercado", "Os negócios independentes demoram mais para dar lucro, o que favorece o modelo corporativo", "Ambientes restritivos protegem o projeto de riscos e elevam a lucratividade corporativa", "A falta de autonomia, a dificuldade de sustentar projetos de longo prazo e o ambiente restritivo reduzem o sucesso", "A ausência de liberdade para decidir favorece a inovação nas grandes organizações"], 3,
      "Problemas: falta de liberdade para decidir, dificuldade de manter projetos de longo prazo, ambiente restritivo. E os **independentes se tornam lucrativos duas vezes mais rápido e são duas vezes mais lucrativos**. (Lista 2, questão 5.)",
      "Criar um projeto dentro de uma empresa grande é como correr com o freio de mão puxado.",
      ["Contradiz o slide: o sucesso corporativo é menor que o dos independentes.", "Os independentes se tornam lucrativos duas vezes mais rápido.", "Os ambientes restritivos prejudicam, e não elevam, a lucratividade.", "", "A falta de liberdade prejudica a inovação."]],
    ["intra", "No caso do **PlayStation**, qual sequência de fatos está correta?",
      ["A Nintendo aceitou a parceria com a Sony e lançou o PlayStation em 1994, usando cartuchos", "Kutaragi propôs um CD-ROM ao SNES; a Nintendo recuou e fez parceria com a Philips; a Sony criou o próprio console (1994)", "A Philips comprou a ideia de Kutaragi e lançou o console em 1994, com a Sony como fornecedora", "Os executivos da Sony vetaram a ideia de Kutaragi, que fundou a própria empresa e criou o console em 1994", "A Sony já planejava entrar no mercado de games e Kutaragi executou o projeto aprovado pela diretoria desde o início"], 1,
      "Sony tinha receio de entrar em games; Kutaragi propôs CD-ROM para o SNES; Nintendo aceitou e depois **voltou atrás (Philips)**; executivos, irritados, deram o sinal verde para o console próprio; **1994, com CDs em vez de cartuchos**. É o case de **intraempreendedorismo** do slide.",
      "Funcionário insistente + chefes irritados com um parceiro que deu o cano = nasce um produto que mudou a empresa.",
      ["A parceria com a Nintendo foi frustrada, e o PlayStation usou CDs, e não cartuchos.", "", "O PlayStation é da Sony; a Nintendo é que fez parceria com a Philips.", "Kutaragi convenceu os executivos da Sony, que deram sinal verde ao console.", "A Sony tinha receio de entrar no mercado, e Kutaragi precisou convencer os executivos."]],

    // ========== ESTRATÉGIA ==========
    ["estrat", "Jovens empreendedores brasileiros querem abrir um food truck. Segundo os conceitos de estratégia empreendedora, o que é uma **nova entrada**?",
      ["Lançar um produto já existente em um mercado em que a empresa já atua, com a mesma estratégia de antes e o mesmo público", "Novo produto em mercado novo ou estabelecido, produto conhecido em mercado novo, ou criação de uma organização", "Criar uma estratégia de preços para recuperar a participação perdida para os concorrentes", "Reduzir os custos de produção de um produto estabelecido para ampliar a margem de lucro", "Recombinar recursos já usados pela empresa, sem oferecer nada novo ao mercado"], 1,
      "**Nova entrada** = (1) novo produto em mercado estabelecido ou novo; (2) produto estabelecido em mercado novo; ou (3) criação de nova organização. (Lista 3, questão 1.)",
      "Entrar na festa: com um prato novo, com um prato conhecido para outra turma, ou abrindo a sua própria festa.",
      ["Mesmo produto no mesmo mercado não é uma nova entrada.", "", "Estratégia de preços para recuperar participação não é nova entrada.", "Reduzir custos não é nova entrada.", "A nova entrada exige oferecer algo novo ou entrar em um mercado novo."]],
    ["estrat", "A **estratégia empreendedora** é:",
      ["O plano financeiro que define o orçamento e as metas de receita da nova empresa", "O conjunto de decisões, ações e reações que geram e depois exploram uma nova entrada", "O conjunto de ações que defendem a participação de mercado de um negócio já consolidado", "A escolha do nome, da marca e da identidade visual com que a empresa entra no mercado", "A decisão de copiar a estratégia do concorrente líder para reduzir o risco de entrada"], 1,
      "Estratégia empreendedora = conjunto de **decisões, ações e reações** que **primeiro geram e depois exploram** uma nova entrada.",
      "Tudo o que você decide e faz para entrar no mercado e depois se manter nele.",
      ["Não é plano financeiro.", "", "A estratégia empreendedora diz respeito à nova entrada, e não à defesa de um negócio consolidado.", "Nome e marca são só parte do que a empresa define; a estratégia envolve decisões, ações e reações.", "Não é cópia da estratégia de outra empresa."]],
    ["estrat", "Uma fabricante de bicicletas adota modificações sugeridas por ciclistas off-road para atender um nicho. Aplicando o conceito de recursos, quando os insumos geram **vantagem competitiva**?",
      ["Quando são comuns e fáceis de copiar pelos concorrentes", "Quando são valiosos, raros e inimitáveis pelos concorrentes", "Quando não são usados no processo produtivo da empresa", "Quando ignoram o conhecimento empírico dos usuários do produto", "Quando representam o maior custo da produção da empresa"], 1,
      "Recursos (insumos do processo produtivo) trazem vantagem competitiva quando são **valiosos, raros e inimitáveis**. (Lista 3, questão 2.)",
      "A receita secreta do restaurante: boa, que poucos têm e que ninguém consegue copiar.",
      ["Se são comuns e copiáveis, não geram vantagem competitiva.", "", "Recurso é o insumo usado no processo produtivo.", "O conhecimento empírico ajuda a formar o recurso empreendedor.", "O peso do recurso no custo não define a vantagem competitiva."]],
    ["estrat", "O **recurso empreendedor** é formado por:",
      ["O capital financeiro reunido pelo empreendedor antes de abrir o negócio, somado ao apoio de investidores", "A soma e a recombinação de recursos, guiadas por experiência e conhecimento de mercado", "A tecnologia mais avançada disponível, adquirida antes dos concorrentes", "A mão de obra qualificada contratada para operar o processo produtivo", "A ausência de concorrentes no mercado em que a empresa decide entrar"], 1,
      "Recurso empreendedor = soma e/ou **recombinação** de recursos. Combinar e recombinar bem exige **experiência e conhecimento de mercado**.",
      "Legos: o poder está em combinar as peças de um jeito novo, não nas peças isoladas.",
      ["O capital é um recurso, mas o recurso empreendedor é a soma e a recombinação de recursos.", "", "A tecnologia é um recurso, mas não é o recurso empreendedor.", "Mão de obra é um insumo, e não o recurso empreendedor.", "Isso não aparece no slide."]],
    ["estrat", "Pilotos de trilha incorporam mudanças em suas motos que só depois serão incorporadas pelas montadoras, atendendo a um nicho. Isso exemplifica o conhecimento:",
      ["Tecnológico, que aproveita o know-how de uma tecnologia em outras áreas", "Empírico, de quem conhece um produto como consumidor aficionado", "De mercado, baseado em pesquisa formal com os clientes do segmento", "Estrutural, que liga mecanismos de uma tecnologia aos de um mercado", "Administrativo, adquirido na gestão de empresas do setor automotivo"], 1,
      "**Conhecimento empírico**: conhecer muito um produto como consumidor aficionado ajuda a ver **onde estão as falhas** e como melhorar. (Lista 3, questão 6.)",
      "Quem anda de moto todo fim de semana sabe melhor que o engenheiro onde a moto falha.",
      ["O caso é de usuários que conhecem o produto, e não de uma tecnologia transferida a outras áreas.", "", "No exemplo não há pesquisa formal: os pilotos adaptam as motos por experiência própria.", "Pensamento estrutural não é um tipo de conhecimento; o caso é de conhecimento empírico.", "O exemplo é de usuários do produto, e não de gestores do setor."]],
    ["estrat", "Qual afirmação reflete o papel do **conhecimento de mercado** e as limitações da pesquisa de mercado?",
      ["A pesquisa de mercado elimina a incerteza e permite prever com precisão a aceitação das inovações", "Conhecer o problema do consumidor aumenta as chances de sucesso, embora a pesquisa tenha limites", "O conhecimento de mercado perde importância quando a empresa domina a tecnologia que oferece", "Recursos raros dispensam a análise dos clientes, pois garantem demanda para o produto", "Quanto mais tempo se investe em pesquisa, menor o risco de a janela de oportunidade se fechar"], 1,
      "Conhecimento de mercado = **informações, tecnologia, know-how e competência** para analisar mercado e clientes; entender o problema do consumidor aumenta a chance de sucesso. **Limitação:** as pessoas têm dificuldade de dizer que precisam de algo que ainda não existe. (Lista 3, questão 3.)",
      "Antes do smartphone ninguém pedia um smartphone — a pesquisa de mercado não captaria isso.",
      ["A pesquisa tem limitações: as pessoas têm dificuldade de dizer que precisam do que não existe.", "", "Ignorar o mercado reduz a probabilidade de sucesso.", "A raridade do recurso não elimina a necessidade de analisar os clientes.", "É o oposto: quanto mais tempo se gasta com informações, maior a chance de a janela se fechar."]],
    ["estrat", "Ao ver a tecnologia do computador sendo usada em diversas indústrias, qual é o impacto do **conhecimento tecnológico** no empreendedorismo?",
      ["Limita as inovações às aplicações para as quais a tecnologia foi criada", "Pode ser aproveitado em outras áreas, mesmo sem aplicação óbvia, gerando novos conhecimentos", "Aumenta o risco de erros de omissão, pois afasta o empreendedor do mercado", "Torna obsoletos os recursos inimitáveis da empresa ao difundir as tecnologias entre os concorrentes", "Dispensa novas recombinações de recursos, pois entrega soluções prontas"], 1,
      "Estar atento e dispor de informações, tecnologia, know-how e competência **facilita a geração de novos conhecimentos**; a tecnologia pode ser aproveitada em outras áreas, ainda que **não óbvia**. (Lista 3, questão 5.)",
      "A mesma tecnologia do computador virou calculadora, carro, celular, geladeira…",
      ["O conhecimento tecnológico amplia as aplicações possíveis.", "", "Não há relação com erros de omissão.", "Não torna os recursos obsoletos.", "O conhecimento tecnológico estimula novas recombinações."]],

    // ========== JANELA / PIONEIRO ==========
    ["janela", "O que é a **janela de oportunidade**?",
      ["Período em que o ambiente é favorável para explorar uma oportunidade de negócio", "Prazo em que o empreendedor recupera o capital investido na nova empresa", "Etapa de pesquisa de mercado que antecede o lançamento de um novo produto", "Período legal para registrar a marca e proteger a ideia contra cópias", "Fase em que a empresa reduz as operações e se prepara para sair do mercado"], 0,
      "Janela de oportunidade = **período em que o ambiente é favorável** à exploração de uma oportunidade. Ela **abre e fecha**.",
      "A promoção de passagens: existe por tempo limitado, quem hesita perde.",
      ["", "Isso é prazo de retorno do investimento.", "A janela não é uma pesquisa; pesquisar demais pode fechá-la.", "Não é prazo de registro de marca.", "Não é a fase de saída do mercado."]],
    ["janela", "Em uma empresa brasileira de apps, qual medida equilibra obter informações prévias com o risco de **fechar a janela de oportunidade**?",
      ["Ampliar a pesquisa de mercado até eliminar as dúvidas antes de lançar o produto", "Agir rápido, aceitando o risco de erros de comissão em vez de erros de omissão", "Priorizar a tecnologia e deixar de lado o conhecimento empírico dos usuários", "Adiar a entrada até que a concorrência teste o mercado e reduza as incertezas", "Lançar com recursos mínimos e de baixo valor para reduzir o custo da tentativa"], 1,
      "Quanto mais tempo se gasta obtendo informações, **maior a chance de a janela se fechar**. A lista aponta o equilíbrio de agir rápido, aceitando erro de comissão. (Lista 3, questão 4.)",
      "Esperar a promoção virar certeza e descobrir que os ingressos acabaram.",
      ["Pesquisa em excesso consome tempo e fecha a janela de oportunidade.", "", "Deixar de lado o conhecimento empírico não resolve o dilema entre informação e tempo.", "Esperar é optar pelo risco de omissão, e a janela pode se fechar.", "Recursos valiosos são desejáveis para gerar vantagem competitiva."]],
    ["janela", "Um empreendedor lança um produto e fracassa (**erro de comissão**); outro desiste e vê um concorrente ocupar o mercado (**erro de omissão**). Qual é a definição correta desses termos?",

      a: "**Diagnóstico:** a empresa corre o risco de perder talentos e ideias por falta de liberdade (como a Xerox perdeu Jobs). Empreendimentos corporativos costumam ter menos sucesso que os independentes por falta de autonomia, dificuldade de manter projetos de longo prazo e ambiente restritivo.\n\n**Plano:**\n1. **Cultura empreendedora:** atuar nas fronteiras da tecnologia; estimular novas ideias; incentivar tentativa e erro e **permitir fracassos**; não impor parâmetros rígidos de oportunidade; disponibilizar recursos acessíveis; formar **equipes multidisciplinares**; adotar **horizonte de longo prazo**; criar **programa de voluntariado** (tempo para projetos próprios); **sistema de recompensa** por contribuição; ter **patrocinadores** e **apoio da alta administração**.\n2. **Autonomia:** descentralizar processos e dar mais autonomia às equipes; estrutura orgânica, com menos camadas entre a alta administração e o cliente.\n3. **Empreendedores corporativos:** incentivar que conheçam o ambiente, sejam persistentes e construam coalizões de patrocinadores.\n4. **Fundo interno** nos moldes da XTV da Xerox.\n\n**Resultado esperado:** como no PlayStation (Kutaragi persistiu e a alta administração apoiou o console próprio), a empresa retém talentos e transforma ideias internas em novos produtos." },

      a: "O **conhecimento empírico** vem de quem conhece muito um produto como consumidor aficionado: ele enxerga **falhas** e **melhorias** antes dos fabricantes. Pilotos de trilha adaptam suas motos para andar fora do asfalto; depois as montadoras incorporam essas mudanças para atender um **nicho**. A estratégia empreendedora pode, assim, focar em um nicho ou **criar novos mercados** a partir da experiência.\n\nO **conhecimento de mercado** (informações, know-how, análise de clientes) é importante, mas a pesquisa tem limite: as pessoas têm dificuldade de dizer que precisam de algo que ainda não existe. O empírico complementa essa limitação.\n\n**Vantagens sociais:** (1) produtos mais adequados às necessidades reais de comunidades específicas; (2) geração de empregos e renda em nichos antes ignorados; (3) inclusão de usuários como coautores da inovação." },
    { t: "Pitch estratégico (AV — 18/12)", q: "Monte a estrutura do pitch de 5 minutos da atividade avaliativa (valor 3,0) e diga o que colocar em cada bloco.",
      a: "São 6 blocos de 0,5 ponto:\n1. **Apresentação da organização:** nome, setor, breve histórico, **missão, visão e valores**.\n2. **Diagnóstico estratégico:** **SWOT** (forças, fraquezas, oportunidades, ameaças) e o **problema estratégico** identificado.\n3. **Objetivo central:** meta principal, de curto ou médio prazo.\n4. **Estratégias propostas:** corporativas, competitivas ou funcionais, **justificadas com modelos estudados** (SWOT, Porter, Balanced Scorecard etc.).\n5. **Indicadores de sucesso e resultados esperados:** KPIs, metas, como medir a efetividade.\n6. **Mensagem final:** por que a estratégia é viável e merece ser implementada.\n\n**Atenção:** slides obrigatórios; 5 minutos; pode ser em grupo de até 5; apresentação presencial em **18/12/2026**; plágio = nota zero." },
    { t: "Monte uma SWOT (diagnóstico do pitch)", q: "Escolha uma organização fictícia (ex.: uma cafeteria universitária). Monte a SWOT com 2 itens por quadrante, escreva o **problema estratégico** e uma estratégia para cada cruzamento (FO, FA, DO, DA).",
      hint: "Para cada item, pergunte: vem de dentro ou de fora? É bom ou ruim?",
      a: "**Forças:** localização dentro do campus; equipe treinada. **Fraquezas:** pouco capital de giro; sem canal de pedidos online. **Oportunidades:** aumento do consumo de cafés especiais; alunos que pedem entrega no intervalo. **Ameaças:** rede de cafeterias de shopping abrindo unidade perto; alta do preço do grão.\n\n**Problema estratégico:** a cafeteria tem demanda e localização favoráveis, mas não consegue atender o pico do intervalo por falta de canal digital e de capital.\n\n**Estratégias:** (ofensiva) usar a localização e a equipe para lançar uma linha de cafés especiais; (confronto) usar a equipe treinada e o relacionamento com os alunos para fidelizar antes da concorrente; (reorientação) investir em um sistema de pedidos pelo celular para aproveitar o pico de demanda; (defensiva) negociar com dois fornecedores de grão para reduzir o impacto do aumento de preço." }
  ],
  // ids antigos das questões cujo texto da resposta certa mudou: mantém o progresso salvo (não apagar!)
  pin: {"1h6m3qv":"125qq9y","12szsyu":"zn88ap","vhj99x":"evt58a","va88c4":"1agwfbo","gnspxm":"1s85ven","ke829":"bi7hu5","19dj2dk":"19cef2o","1lq0c20":"f80wmi","1fcekfw":"eg25gq","witbyw":"1hsn9y9","1dvbl57":"1m75mzc","1bgh61y":"124fnnn","mqrckq":"13pcna4","1n3y9ua":"1dxcnev","kqauje":"q8180n","1a9s1h2":"ls7y01","fxvai8":"1ilny0p","cc069u":"1nraspi","1fa72hy":"1m6wsbu","1vf9mqz":"1ghdlbr","1ow2ze3":"10fgkvw","1fvanr9":"9q44co","lj2ffq":"16dftph","4vi2qz":"12ijl8l","1hqq2hi":"6qh8z6","18os1tb":"19o1ijr","1x24ajx":"45kjpz","15zqv9n":"pakofn","h0k6y5":"w680lq","oyu9et":"1yubw9k","10gp6gw":"spcxo9","13x6dgu":"ylbjx3","if9c4a":"ij30qy","701auh":"gbpax1","d78yr3":"6dwrk","9pq3bd":"1jl56x7","1m3re0q":"o1dsbu","ifk7jf":"1kj2chu","17x725f":"1s5sfih","381p54":"tr4kv2"}
};

<script>/* Motor de simulado — compartilhado pelos 4 sites */
(function () {
  const E = window.EXAM;
  const LET = "ABCDEFG";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const md = (s) =>
    esc(s == null ? "" : s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\n/g, "<br>");

  // id estável da questão = hash de assunto + enunciado + código + texto da resposta certa.
  // O progresso é salvo por esse id (e não pela posição), então inserir/reordenar questões não perde nada.
  const qid = (a) => { const t = a[0] + "|" + a[1] + "|" + (a[7] || "") + "|" + a[2][a[3]]; let h = 5381; for (let k = 0; k < t.length; k++) h = ((h << 5) + h + t.charCodeAt(k)) | 0; return (h >>> 0).toString(36); };
  // normaliza perguntas: [topico, enunciado, opcoes, correta, explicacao, analogia, porQueErrado[], codigo]
  // gira as alternativas de forma fixa por questão, para a letra certa não ficar sempre na mesma posição
  const Q = E.questions.map((a, i) => {
    let o = a[2], ans = a[3], w = a[6] || [];
    const n = o.length, r = (i * 7 + 3) % n;
    if (r) { const rot = (arr) => arr.map((_, k) => arr[(k + r) % n]); o = rot(o); w = w.length ? rot(w) : w; ans = (ans - r + n) % n; }
    return { i, id: (E.pin && E.pin[qid(a)]) || qid(a), t: a[0], q: a[1], o, a: ans, e: a[4], an: a[5], w, c: a[7] || "", bonus: a[0] === "extra" };
  });
  const T = {};
  E.topics.forEach((t) => (T[t.id] = t));
  const lvl = (p) => (p >= 85 ? ["hot", "Muito alta"] : p >= 70 ? ["high", "Alta"] : p >= 50 ? ["mid", "Média"] : ["low", "Baixa"]);

  // ---------- persistência ----------
  const KEY = "sim_" + E.id;
  let store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || { q: {}, hist: [] }; } catch (e) { return { q: {}, hist: [] }; } })();
  const save = () => { store.total = Q.length; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  // migração: versões antigas guardavam o progresso pela posição da questão (chave numérica)
  if (store.v !== 2) {
    const nq = {}; let moved = 0;
    for (const k in store.q) { if (/^\d+$/.test(k)) { if (Q[+k]) { nq[Q[+k].id] = store.q[k]; moved++; } } else nq[k] = store.q[k]; }
    store.q = nq; store.v = 2;
    if (moved || Object.keys(nq).length) save();
  }
  const record = (i, ok) => { const id = Q[i].id, p = store.q[id] || { n: 0 }; store.q[id] = { ok, n: p.n + 1 }; save(); };

  // ---------- estado ----------
  let view = "home";
  let S = null; // sessão do quiz
  const app = $("#app");
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- navegação ----------
  const VIEWS = ["home", "setup", "quiz", "result", "cheat", "practice"];
  function nav() {
    const tabs = [["home", "Prioridades"], ["setup", "Simulado"], ["cheat", "Resumão"]];
    if (E.practice) tabs.push(["practice", E.practiceTab || "Prática"]);
    const cur = view === "quiz" || view === "result" ? "setup" : view;
    $("#tabs").innerHTML = tabs.map(([k, n]) => `<button class="${k === cur ? "on" : ""}" data-go="${k}">${n}</button>`).join("");
  }
  // mostra uma tela (sem mexer no histórico); telas que dependem de uma sessão caem em "home" se ela não existe
  function show(v) {
    if (!VIEWS.includes(v)) v = "home";
    if (v === "quiz" && (!S || S.done)) v = S && S.done ? "result" : "home";
    if (v === "result" && !(S && S.done)) v = "home";
    view = v; render(); window.scrollTo(0, 0);
  }
  // vai para uma tela e registra no histórico do navegador: o botão "voltar" (inclusive no celular) funciona
  function go(v) { show(v); if (location.hash !== "#" + v) { try { location.hash = v; } catch (e) {} } }
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1) || "home"; if (v !== view) show(v); });
  function render() { nav(); const hi = $("#h-intro"); if (hi) hi.hidden = view !== "home"; ({ home, setup, quiz, result, cheat, practice })[view](); }

  // ---------- estatísticas ----------
  function topicStats(id) {
    const qs = Q.filter((q) => q.t === id);
    const done = qs.filter((q) => store.q[q.id]);
    const ok = done.filter((q) => store.q[q.id].ok).length;
    return { total: qs.length, done: done.length, ok, acc: done.length ? ok / done.length : null };
  }

  // ---------- INÍCIO ----------
  function home() {
    const answered = Object.keys(store.q).length;
    const right = Object.values(store.q).filter((x) => x.ok).length;
    const rows = E.topics.map((t) => ({ t, s: topicStats(t.id) }));
    const prio = rows.slice().sort((a, b) => b.t.prob * (1 - (b.s.acc ?? 0) * 0.9) - a.t.prob * (1 - (a.s.acc ?? 0) * 0.9)).slice(0, 3);
    const card = ({ t, s }) => {
      const [cls, lab] = lvl(t.prob);
      const acc = s.acc == null ? `${s.total} questões` : `${s.total} questões · ${s.ok}/${s.done} certas`;
      return `<div class="tcard ${t.focus ? "focus" : ""}" data-topic="${t.id}" role="button" tabindex="0">
        <div class="tc-top"><span class="lvl ${cls}">${lab}</span><span class="pct">~${t.prob}% de chance</span></div>
        <h3>${t.name}</h3>
        ${t.src ? `<div class="tc-src"><span class="src ${t.focus ? "focus" : ""}">${t.focus ? t.src + " · foco do professor" : t.src}</span></div>` : ""}
        <p class="twhy">${md(t.why)}</p>
        <div class="bar2 ${s.acc == null ? "" : s.acc >= 0.7 ? "acc" : "bad"}"><i style="width:${s.acc == null ? t.prob : s.acc * 100}%"></i></div>
        <div class="tc-foot"><span>${acc}</span><span class="go">Treinar &rarr;</span></div></div>`;
    };
    app.innerHTML = `
    ${resumeBar()}
    ${E.notice ? `<div class="notice">${md(E.notice)}</div>` : ""}
    <div class="card stats">
      <div><b>${Q.length}</b><span>questões no banco</span></div>
      <div><b>${answered}</b><span>já respondidas</span></div>
      <div><b>${answered ? Math.round((right / answered) * 100) + "%" : "—"}</b><span>de acerto${answered ? ` · ${right} certas, ${answered - right} erradas` : ""}</span></div>
    </div>
    <div class="sec"><h2>Por onde começar</h2><p>Ordenado por chance de cair e pelo quanto você ainda erra. Ao terminar um assunto, o simulado segue direto para o próximo e avisa a troca.</p></div>
    <div class="row">${prio.map((r) => `<button class="btn ghost" data-topic="${r.t.id}">${r.t.name}</button>`).join("")}</div>
    <div class="sec"><h2>Mapa de probabilidade por assunto</h2><p>A barra mostra a chance de cair; depois que você treina, ela passa a mostrar o seu acerto.</p></div>
    <div class="tgrid">${rows.map(card).join("")}</div>
    ${E.plan ? `<div class="sec"><h2>Plano de estudo sugerido</h2></div><div class="card"><ol class="list" style="margin:0">${E.plan.map((p) => `<li>${md(p)}</li>`).join("")}</ol></div>` : ""}
    ${store.hist.length ? `<div class="sec"><h2>Seus últimos simulados</h2></div><div class="card"><ul class="list" style="margin:0">${store.hist.slice(-6).reverse().map((h) => `<li>${h.d} · <b>${h.s}/${h.n}</b> (${Math.round((h.s / h.n) * 100)}%) · ${esc(h.m)}</li>`).join("")}</ul>
      <div style="margin-top:14px"><button class="btn ghost sm" data-act="reset">Apagar meu histórico</button></div></div>` : ""}
    ${E.disclaimer ? `<div class="details-card"><details><summary>Como estimei a chance de cair</summary><p>${md(E.disclaimer)}</p></details></div>` : ""}`;
  }

  // aviso "simulado em andamento" (home e setup)
  function resumeBar() {
    if (!S || S.done) return "";
    const answered = S.list.filter((i) => S.ans[i] != null).length;
    return `<div class="notice resume"><div><b>Simulado em andamento</b><div class="small muted">Questão ${S.p + 1} de ${S.list.length} · ${answered} respondidas · ${esc(S.label)}</div></div>
      <div class="row"><button class="btn sm" data-act="resume">Retomar</button><button class="btn ghost sm" data-act="discard">Descartar</button></div></div>`;
  }

  // ---------- MONTAR SIMULADO ----------
  let cfg = { mode: "full", topic: E.topics[0].id, feedback: "treino", sq: true, so: true, chain: true, mix: false };
  function setup() {
    const wrongs = Q.filter((q) => store.q[q.id] && !store.q[q.id].ok).length;
    const R = (name, val, cur, title, desc) => `<label class="opt-row ${cur === val ? "on" : ""}"><input type="radio" name="${name}" value="${val}" ${cur === val ? "checked" : ""}><div><b>${title}</b><div class="small muted">${desc}</div></div></label>`;
    app.innerHTML = `${resumeBar()}<div class="card"><h2>Montar simulado</h2>
      <p class="muted small" style="margin:-4px 0 12px">O simulado segue em fluxo contínuo, assunto por assunto: ao terminar um, entra direto no próximo e avisa a troca.</p>
      ${R("mode", "full", cfg.mode, `Completo · ${Q.length} questões`, "Todas as questões, assunto por assunto, como numa prova de verdade.")}
      ${R("mode", "top", cfg.mode, "Rápido · as 20 mais prováveis", "Questões dos assuntos com maior chance de cair. Bom para a véspera.")}
      ${R("mode", "topic", cfg.mode, "Por assunto", `Começa no assunto escolhido e segue para os próximos.<br><select id="tsel">${E.topics.map((t) => `<option value="${t.id}" ${t.id === cfg.topic ? "selected" : ""}>${t.name} (${Q.filter((q) => q.t === t.id).length})</option>`).join("")}</select>`)}
      ${R("mode", "wrong", cfg.mode, `Só as que eu errei · ${wrongs}`, wrongs ? "Refaz apenas as questões que você errou da última vez." : "Nada para refazer ainda. Faça um simulado primeiro.")}
      <h3>Modo</h3>
      ${R("fb", "treino", cfg.feedback, "Treino", "Mostra se acertou e explica na hora, a cada questão. Melhor para aprender.")}
      ${R("fb", "prova", cfg.feedback, "Prova", "Resultado e explicações só no final. Simula a pressão real.")}
      <label class="check" style="margin-top:14px"><input type="checkbox" id="chain" ${cfg.chain ? "checked" : ""}> Em “Por assunto”, ao terminar seguir para o próximo assunto</label>
      <label class="check"><input type="checkbox" id="mix" ${cfg.mix ? "checked" : ""}> Misturar as questões de todos os assuntos (sem blocos)</label>
      <label class="check"><input type="checkbox" id="sq" ${cfg.sq ? "checked" : ""}> Embaralhar a ordem das questões dentro de cada assunto</label>
      <label class="check"><input type="checkbox" id="so" ${cfg.so ? "checked" : ""}> Embaralhar as alternativas (evita decorar a letra)</label>
      <div style="margin-top:18px"><button class="btn" data-act="start" ${cfg.mode === "wrong" && !wrongs ? "disabled" : ""}>Começar</button></div></div>`;
  }

  // ordena as questões em blocos por assunto, na ordem do mapa (a partir de startId, dando a volta no fim)
  function orderByTopic(qs, startId, byProb) {
    let ids = E.topics.map((t) => t.id);
    if (byProb) ids = E.topics.slice().sort((a, b) => b.prob - a.prob).map((t) => t.id);
    else if (startId) { const k = ids.indexOf(startId); ids = ids.slice(k).concat(ids.slice(0, k)); }
    const by = {}; qs.forEach((q) => (by[q.t] = by[q.t] || []).push(q));
    let out = [];
    ids.forEach((t) => { if (by[t]) out = out.concat(cfg.sq ? shuffle(by[t]) : by[t].slice().sort((a, b) => a.i - b.i)); });
    return out;
  }
  function buildList() {
    let l, byProb = false, start = null;
    if (cfg.mode === "full") l = Q.slice();
    else if (cfg.mode === "top") { l = Q.slice().sort((a, b) => T[b.t].prob - T[a.t].prob || Math.random() - 0.5).slice(0, 20); byProb = true; }
    else if (cfg.mode === "topic") { l = cfg.chain ? Q.slice() : Q.filter((q) => q.t === cfg.topic); start = cfg.topic; }
    else l = Q.filter((q) => store.q[q.id] && !store.q[q.id].ok);
    return cfg.mix ? shuffle(l) : orderByTopic(l, start, byProb);
  }
  function startSession(list, label) {
    S = { list: list.map((q) => q.i), p: 0, ans: {}, ord: {}, fb: cfg.feedback, label, t0: Date.now(), back: view === "setup" ? "setup" : "home", mixed: cfg.mix, segs: [] };
    S.list.forEach((i) => { const n = Q[i].o.length; const idx = [...Array(n).keys()]; S.ord[i] = cfg.so ? shuffle(idx) : idx; });
    // blocos por assunto (um bloco = sequência de questões do mesmo assunto)
    S.list.forEach((i, p) => { const t = Q[i].t, last = S.segs[S.segs.length - 1]; if (!last || last.t !== t) S.segs.push({ t, from: p, to: p }); else last.to = p; });
    go("quiz");
  }
  const segOf = (p) => S.segs.findIndex((s) => p >= s.from && p <= s.to);
  const segDone = (sg) => { let n = 0; for (let p = sg.from; p <= sg.to; p++) if (S.ans[S.list[p]] != null) n++; return n; };
  const segRight = (sg) => { let n = 0; for (let p = sg.from; p <= sg.to; p++) if (S.ans[S.list[p]] === Q[S.list[p]].a) n++; return n; };

  // ---------- QUESTÃO ----------
  function quiz() {
    const i = S.list[S.p], q = Q[i], ord = S.ord[i], picked = S.ans[i];
    const locked = S.fb === "treino" && picked != null;
    const [cls, lab] = lvl(T[q.t].prob);
    const n = S.list.length, k = segOf(S.p), sg = S.segs[k], m = S.segs.length;
    const mixed = S.mixed || m < 2;
    const newTopic = !mixed && S.p === sg.from;
    const prev = k > 0 ? S.segs[k - 1] : null;
    const nextIsNew = !mixed && S.p === sg.to && S.p < n - 1;
    const banner = newTopic ? `<div class="newtopic"><div class="label">${k === 0 ? "Começando" : "Novo assunto"} · ${k + 1} de ${m}</div><b>${esc(T[q.t].name)}</b>
        <div class="small muted">${sg.to - sg.from + 1} ${sg.to === sg.from ? "questão" : "questões"} · chance de cair: ${lab.toLowerCase()}${prev && S.fb === "treino" ? ` · você concluiu <b>${esc(T[prev.t].name)}</b> com ${segRight(prev)}/${prev.to - prev.from + 1} certas` : ""}</div></div>` : "";
    const chips = mixed ? "" : `<div class="segs">${S.segs.map((s, j) => { const d = segDone(s), sz = s.to - s.from + 1; return `<button class="segchip ${j === k ? "on" : ""} ${d === sz ? "done" : ""}" data-seg="${j}" title="${esc(T[s.t].name)}"><span>${esc(T[s.t].name)}</span><i>${d}/${sz}</i></button>`; }).join("")}</div>`;
    app.innerHTML = `<div class="card">
      <div class="row sp" style="margin-bottom:6px"><button class="btn ghost sm" data-act="leave">&larr; Sair</button><span class="qhead"><span id="clock"></span></span></div>
      <div class="qhead"><span>Questão ${S.p + 1} de ${n} · ${esc(S.label)}</span></div>
      <div class="progress"><i style="width:${(S.p / n) * 100}%"></i></div>
      ${chips}${banner}
      <div class="tags"><span class="tag">${esc(T[q.t].name)}</span><span class="tag"><span class="lvl ${cls}">Chance ${lab.toLowerCase()}</span></span>${q.bonus ? '<span class="tag">bônus</span>' : ""}</div>
      <div class="qtext">${md(q.q)}</div>
      ${q.c ? `<pre class="code">${esc(q.c)}</pre>` : ""}
      <div id="opts">${ord.map((oi, kk) => {
        let c = "opt";
        if (locked) { c += " lock"; if (oi === q.a) c += " ok"; else if (oi === picked) c += " no"; }
        else if (picked === oi) c += " sel";
        return `<button class="${c}" data-opt="${oi}"><span class="l">${LET[kk]}</span><span>${md(q.o[oi])}</span></button>`;
      }).join("")}</div>
      <div class="fb" id="fb">${locked ? explain(q, picked) : ""}</div>
      <div class="row sp" style="margin-top:22px">
        <button class="btn ghost" data-act="prev" ${S.p === 0 ? "disabled" : ""}>Anterior</button>
        <div class="row">${S.fb === "treino" && picked == null && S.p < n - 1 ? '<button class="btn ghost" data-act="skip">Pular</button>' : ""}
        <button class="btn" data-act="next" ${S.fb === "treino" && picked == null ? "disabled" : ""}>${S.p === n - 1 ? "Finalizar" : nextIsNew ? "Próximo assunto" : "Próxima"}</button></div>
      </div>
      <div class="endrow"><button class="linkbtn" data-act="end">Encerrar agora e ver o resultado</button></div></div>`;
    tick();
  }
  let clockT;
  function tick() {
    clearInterval(clockT);
    const f = () => { const el = $("#clock"); if (!el || !S) return clearInterval(clockT); const s = Math.floor((Date.now() - S.t0) / 1000); el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
    f(); clockT = setInterval(f, 1000);
  }

  function explain(q, picked) {
    const ord = S.ord[q.i] || q.o.map((_, k) => k);
    const L = (oi) => LET[ord.indexOf(oi)];
    let h = "";
    if (picked == null) h += `<div class="why bad"><span class="label">Sem resposta</span></div>`;
    else if (picked !== q.a) h += `<div class="why bad"><span class="label">Incorreta · você marcou ${L(picked)}</span><p>${md(q.w[picked] || "Não é a alternativa que o conteúdo da aula sustenta.")}</p></div>`;
    else h += `<div class="why good"><span class="label">Correta</span></div>`;
    h += `<div class="why good"><span class="label">Resposta certa</span><p class="ans">${L(q.a)}) ${md(q.o[q.a])}</p><p>${md(q.e)}</p></div>`;
    if (q.an) h += `<div class="an"><span class="label">Para fixar</span>${md(q.an)}</div>`;
    const others = q.o.map((_, k) => k).filter((k) => k !== q.a && k !== picked && q.w[k]);
    if (others.length) h += `<details><summary>Por que as outras alternativas estão erradas</summary><ul>${others.map((k) => `<li><b>${L(k)})</b> ${md(q.o[k])}<br><span class="muted">${md(q.w[k])}</span></li>`).join("")}</ul></details>`;
    return h;
  }

  function answer(oi) {
    const i = S.list[S.p], q = Q[i];
    if (S.fb === "treino") {
      if (S.ans[i] != null) return;
      S.ans[i] = oi; record(i, oi === q.a); quiz();
      const f = $("#fb"); if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else { S.ans[i] = oi; quiz(); }
  }

  function finish(early) {
    clearInterval(clockT);
    if (early) S.list = S.list.filter((i) => S.ans[i] != null);          // só conta o que foi respondido
    if (!S.list.length) { S = null; go("home"); return; }
    if (S.fb === "prova") S.list.forEach((i) => { if (S.ans[i] != null) record(i, S.ans[i] === Q[i].a); });
    const s = S.list.filter((i) => S.ans[i] === Q[i].a).length;
    store.hist.push({ d: new Date().toLocaleDateString("pt-BR") + " " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), s, n: S.list.length, m: S.label });
    save(); S.done = true; go("result");
  }

  // ---------- RESULTADO ----------
  function result() {
    const n = S.list.length, s = S.list.filter((i) => S.ans[i] === Q[i].a).length, pct = Math.round((s / n) * 100);
    const byT = {};
    S.list.forEach((i) => { const t = Q[i].t; byT[t] = byT[t] || { n: 0, s: 0 }; byT[t].n++; if (S.ans[i] === Q[i].a) byT[t].s++; });
    const wrongs = S.list.filter((i) => S.ans[i] !== Q[i].a);
    const msg = pct >= 90 ? "Excelente. Você está pronto." : pct >= 70 ? "Muito bom. Revise só os erros abaixo." : pct >= 50 ? "No caminho. Foque nos assuntos com barra vermelha." : "É para isso que serve o simulado. Leia as explicações e refaça só os erros.";
    app.innerHTML = `<div class="card"><div class="row" style="gap:28px;align-items:flex-end"><div><div class="score">${pct}%</div><div class="muted small" style="margin-top:6px">${s} de ${n} certas · ${Math.max(1, Math.round((Date.now() - S.t0) / 60000))} min</div></div><div style="flex:1;min-width:220px"><h2 style="margin:0;font-size:1.15rem">${msg}</h2></div></div>
      <hr class="hr"><div class="row"><button class="btn" data-act="redoWrong" ${wrongs.length ? "" : "disabled"}>Refazer só as erradas · ${wrongs.length}</button><button class="btn ghost" data-go="setup">Novo simulado</button><button class="btn ghost" data-go="home">Prioridades</button></div></div>
      <div class="card"><h2>Desempenho por assunto</h2><table class="topics">${Object.entries(byT).sort((a, b) => a[1].s / a[1].n - b[1].s / b[1].n).map(([t, v]) => `<tr><td style="padding:12px 12px 12px 0">${esc(T[t].name)}</td><td style="width:40%;padding:12px 12px 12px 0"><div class="bar2 ${v.s / v.n >= 0.7 ? "acc" : "bad"}" style="margin:0"><i style="width:${(v.s / v.n) * 100}%"></i></div></td><td style="text-align:right;padding:12px 0" class="tnum">${v.s}/${v.n}</td></tr>`).join("")}</table></div>
      ${wrongs.length ? `<div class="card rev"><h2>Revise o que você errou · ${wrongs.length}</h2>${wrongs.map((i) => { const q = Q[i]; return `<details open><summary>${esc(T[q.t].name)} · ${esc(q.q.slice(0, 90))}${q.q.length > 90 ? "…" : ""}</summary><div class="qtext" style="margin-top:14px">${md(q.q)}</div>${q.c ? `<pre class="code">${esc(q.c)}</pre>` : ""}${explain(q, S.ans[i])}</details>`; }).join("")}</div>` : `<div class="card"><h2>Gabarito perfeito</h2><p class="muted" style="margin:0">Nenhum erro neste simulado.</p></div>`}`;
  }

  // ---------- RESUMÃO ----------
  function cheat() {
    app.innerHTML = `<div class="card"><h2>Resumão para a véspera</h2><p class="muted small" style="margin:0">Tudo que mais cai, em uma página. Leia antes de dormir e de novo antes da prova.</p></div>` +
      E.cheat.map((s) => `<div class="card"><h2>${s.h}</h2>${s.pre ? `<pre class="code">${esc(s.pre)}</pre>` : ""}${(s.items || []).length ? `<ul class="list">${s.items.map((x) => `<li>${typeof x === "string" ? md(x) : x.html}</li>`).join("")}</ul>` : ""}</div>`).join("");
  }

  // ---------- PRÁTICA ----------
  function practice() {
    app.innerHTML = `<div class="card"><h2>${E.practiceName || "Prática"}</h2><p class="muted" style="margin:0">${md(E.practiceIntro || "")}</p></div>` +
      E.practice.map((p, k) => `<div class="card"><h3 style="margin-top:0">${k + 1}. ${md(p.t)}</h3><div style="color:var(--ink2)">${md(p.q)}</div>${p.pre ? `<pre class="code">${esc(p.pre)}</pre>` : ""}${p.hint ? `<details><summary>Dica</summary><p class="muted" style="margin:.5rem 0 0 14px">${md(p.hint)}</p></details>` : ""}
      <details><summary>Ver resolução</summary><div style="margin:.6rem 0 0 14px;color:var(--ink2)">${p.a ? `<p style="margin:0 0 8px">${md(p.a)}</p>` : ""}${p.code ? `<pre class="code">${esc(p.code)}</pre>` : ""}${p.after ? `<p style="margin:8px 0 0">${md(p.after)}</p>` : ""}</div></details></div>`).join("");
  }

  // ---------- eventos ----------
  const startTopic = (id) => { cfg.mode = "topic"; cfg.topic = id; startSession(buildList(), (cfg.chain ? "A partir de: " : "Assunto: ") + T[id].name); };
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-go],[data-act],[data-opt],[data-topic],[data-seg]");
    if (!b) return;
    if (b.dataset.go) return go(b.dataset.go);
    if (b.dataset.topic) return startTopic(b.dataset.topic);
    if (b.dataset.opt != null) return answer(+b.dataset.opt);
    if (b.dataset.seg != null) {                                          // pular para outro assunto da sessão
      const sg = S.segs[+b.dataset.seg]; let p = sg.from;
      for (let x = sg.from; x <= sg.to; x++) if (S.ans[S.list[x]] == null) { p = x; break; }
      S.p = p; quiz(); window.scrollTo(0, 0); return;
    }
    const a = b.dataset.act;
    if (a === "start") { const lab = { full: "Completo", top: "Rápido", topic: (cfg.chain ? "A partir de: " : "Assunto: ") + (T[cfg.topic] || {}).name, wrong: "Só as erradas" }[cfg.mode]; startSession(buildList(), lab + (cfg.feedback === "prova" ? " · prova" : "")); }
    if (a === "next") { if (S.p === S.list.length - 1) finish(); else { S.p++; quiz(); window.scrollTo(0, 0); } }
    if (a === "skip") { if (S.p < S.list.length - 1) { S.p++; quiz(); window.scrollTo(0, 0); } }
    if (a === "prev") { if (S.p > 0) { S.p--; quiz(); window.scrollTo(0, 0); } }
    if (a === "leave") { clearInterval(clockT); go(S && S.back === "setup" ? "setup" : "home"); }
    if (a === "end") { if (S.list.some((i) => S.ans[i] != null) ? confirm("Encerrar agora e ver o resultado do que você já respondeu?") : confirm("Você ainda não respondeu nada. Sair do simulado?")) finish(true); }
    if (a === "resume") go("quiz");
    if (a === "discard") { if (confirm("Descartar o simulado em andamento?")) { clearInterval(clockT); S = null; render(); } }
    if (a === "redoWrong") { const l = S.list.filter((i) => S.ans[i] !== Q[i].a).map((i) => Q[i]); cfg.feedback = "treino"; cfg.mode = "wrong"; startSession(cfg.mix ? shuffle(l) : orderByTopic(l, null, false), "Refazendo erradas"); }
    if (a === "reset") { if (confirm("Apagar todo o histórico desta matéria?")) { store = { q: {}, hist: [], v: 2 }; save(); render(); } }
  });
  document.addEventListener("keydown", (ev) => {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches(".tcard")) { ev.preventDefault(); ev.target.click(); }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.name === "mode") { cfg.mode = t.value; setup(); }
    else if (t.name === "fb") { cfg.feedback = t.value; setup(); }
    else if (t.id === "tsel") cfg.topic = t.value;
    else if (t.id === "sq") cfg.sq = t.checked;
    else if (t.id === "so") cfg.so = t.checked;
    else if (t.id === "chain") cfg.chain = t.checked;
    else if (t.id === "mix") cfg.mix = t.checked;
  });

  // ---------- início ----------
  document.title = E.title + " · Simulado";
  document.documentElement.style.setProperty("--accent", E.color);
  $("#h-title").textContent = E.title;
  $("#h-sub").textContent = E.subtitle;
  $("#h-intro").innerHTML = md(E.intro);
  show(location.hash.slice(1) || "home");
})();
</script>
</body></html>
