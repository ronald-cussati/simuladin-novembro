<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado</title>
<script>/* Tema claro/escuro — roda no <head> para evitar "flash" de tema errado */
(function () {
  var K = "sim_theme", root = document.documentElement, t = null;
  try { t = localStorage.getItem(K); } catch (e) {}
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  root.setAttribute("data-theme", t);
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest("[data-theme-toggle]")) return;
    var n = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", n);
    try { localStorage.setItem(K, n); } catch (e) {}
  });
})();
</script>
<style>/* ---------- tokens ---------- */
:root{
  --accent:#4f46e5;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --bg:#fbfbfa;--surface:#ffffff;--soft:#f4f4f2;
  --ink:#141416;--ink2:#3d3d45;--muted:#74747e;
  --line:#e9e9e6;--line2:#d6d6d2;
  --ok:#15803d;--ok-bg:#f1faf4;--no:#b42318;--no-bg:#fef3f2;
  --accent-fg:var(--accent);
  --radius:12px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0c0c0e;--surface:#141417;--soft:#1b1b1f;
  --ink:#f3f3f5;--ink2:#cfcfd6;--muted:#8d8d98;
  --line:#25252b;--line2:#35353d;
  --ok:#4ade80;--ok-bg:#0e2217;--no:#f87171;--no-bg:#2a1315;
  --accent-fg:color-mix(in srgb,var(--accent) 62%,#fff);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
a{color:inherit}
h1,h2,h3{letter-spacing:-.015em;margin:0}
.wrap,.in{max-width:900px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:14px;height:56px}
.back{color:var(--muted);text-decoration:none;font-size:.875rem;white-space:nowrap}
.back:hover{color:var(--ink)}
.brand{font-weight:650;letter-spacing:-.01em}
nav.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;height:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;font-weight:500;padding:0 12px;cursor:pointer;white-space:nowrap;position:relative;height:100%}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent-fg);border-radius:2px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;flex:none;margin-left:auto}
.icon-btn:hover{border-color:var(--line2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .i-sun{display:none}
html[data-theme="dark"] .icon-btn .i-sun{display:block}
html[data-theme="dark"] .icon-btn .i-moon{display:none}
nav.tabs + .icon-btn{margin-left:0}

/* ---------- topo da página ---------- */
.hero{padding:44px 0 8px}
.hero h1{font-size:clamp(1.65rem,3.6vw,2.3rem);font-weight:650;line-height:1.15}
.hero p{margin:10px 0 0;color:var(--muted);max-width:62ch}
main{max-width:900px;margin:0 auto;padding:24px 20px 96px}
#app>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}html{scroll-behavior:auto}}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card h2{font-size:1.05rem;font-weight:620;margin-bottom:12px}
.card h3{font-size:.95rem;font-weight:620;margin:20px 0 8px}
.label{font-size:.72rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.callout{border-left:2px solid var(--line2);padding:2px 0 2px 16px;margin:16px 0 0;color:var(--ink2);font-size:.93rem}

.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:0}
.stats>div{padding:20px 24px}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:1.9rem;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.85rem}
@media (max-width:560px){.stats>div{padding:16px 14px}.stats b{font-size:1.4rem}}

/* ---------- botões ---------- */
.btn{background:var(--accent);color:#fff;border:1px solid transparent;border-radius:9px;padding:10px 18px;font:inherit;font-size:.92rem;font-weight:550;cursor:pointer;transition:opacity .15s,transform .05s}
html[data-theme="dark"] .btn{background:color-mix(in srgb,var(--accent) 78%,#fff);color:#0c0c0e}
.btn:hover{opacity:.9}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
html[data-theme="dark"] .btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink2);opacity:1}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}

/* ---------- mapa de prioridade ---------- */
table.topics{width:100%;border-collapse:collapse}
table.topics th{font-size:.7rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
table.topics td{padding:16px 12px 16px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.topics tr:last-child td{border-bottom:0;padding-bottom:0}
table.topics td:last-child,table.topics th:last-child{padding-right:0;text-align:right}
.tname{font-weight:600}
.twhy{color:var(--muted);font-size:.85rem;margin-top:2px}
.src{display:inline-block;font-size:.72rem;font-weight:550;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:0 8px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.src.focus{color:var(--accent-fg);border-color:var(--accent-fg)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.lvl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.lvl.hot{--c:#e5484d}.lvl.high{--c:#e9a23b}.lvl.mid{--c:#4c8bf5}.lvl.low{--c:var(--muted)}
.bar2{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;min-width:96px}
.bar2 i{display:block;height:100%;background:var(--accent-fg);border-radius:99px}
.bar2.acc i{background:var(--ok)}
.bar2.bad i{background:var(--no)}
.pct{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:640px){table.topics .hide-s{display:none}}

/* ---------- configuração do simulado ---------- */
.opt-row{display:flex;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;align-items:flex-start;background:var(--surface);transition:border-color .15s,background .15s}
.opt-row:hover{border-color:var(--line2)}
.opt-row.on{border-color:var(--accent-fg);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.opt-row input{margin-top:4px;accent-color:var(--accent)}
.opt-row b{font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--ink2);margin:8px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
select{font:inherit;font-size:.9rem;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);margin-top:8px}

/* ---------- questão ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 20px}
.progress i{display:block;height:100%;background:var(--accent-fg);transition:width .3s}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:.75rem;font-weight:550;color:var(--ink2);background:var(--soft);border-radius:6px;padding:2px 9px}
.qtext{font-size:1.1rem;font-weight:550;line-height:1.5;margin:0 0 16px;letter-spacing:-.005em}
.opt{display:flex;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin:8px 0;font:inherit;font-size:.97rem;cursor:pointer;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not(.lock){border-color:var(--line2);background:var(--soft)}
.opt .l{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-size:.72rem;font-weight:650;color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--accent-fg);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.opt.sel .l{background:var(--accent-fg);border-color:var(--accent-fg);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.no{border-color:var(--no);background:var(--no-bg)}
.opt.no .l{background:var(--no);border-color:var(--no);color:var(--bg)}
.opt.lock{cursor:default}

/* feedback */
.fb{margin-top:22px}
.why{border-left:2px solid var(--c);padding:2px 0 2px 16px;margin:16px 0}
.why .label{color:var(--c);display:block;margin-bottom:4px}
.why p{margin:0;color:var(--ink2)}
.why.good{--c:var(--ok)}
.why.bad{--c:var(--no)}
.why .ans{font-weight:600;color:var(--ink);margin-bottom:6px}
.an{background:var(--soft);border-radius:10px;padding:14px 16px;margin:16px 0;color:var(--ink2);font-size:.95rem}
.an .label{display:block;margin-bottom:4px}

/* código */
pre.code{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:14px 16px;overflow:auto;font:.84rem/1.6 var(--mono);margin:12px 0;white-space:pre;tab-size:4}
code{background:var(--soft);color:var(--ink);padding:1px 6px;border-radius:5px;font:.88em var(--mono);border:1px solid var(--line)}
pre.code code{background:none;border:0;padding:0}

details{margin:10px 0}
details>summary{cursor:pointer;font-size:.9rem;font-weight:550;color:var(--ink2);list-style:none;display:flex;gap:8px;align-items:baseline}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);flex:none;transition:transform .15s;margin-right:2px;position:relative;top:-1px}
details[open]>summary::before{transform:rotate(45deg)}
details>summary:hover{color:var(--ink)}
details ul{margin:.6rem 0 0 6px;padding-left:16px;color:var(--ink2);font-size:.92rem}
details ul li{margin:.5rem 0}
.list{padding-left:20px;margin:0;color:var(--ink2)}
.list li{margin:.5rem 0}

/* ---------- resultado ---------- */
.score{font-size:3.4rem;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.rev>details{padding:14px 0;border-top:1px solid var(--line);margin:0}
.rev>details:first-of-type{border-top:0}

/* ---------- hub (index) ---------- */
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}
@media (max-width:700px){.subjects{grid-template-columns:1fr}}
a.subject{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;transition:border-color .15s,transform .15s}
a.subject:hover{border-color:var(--line2);transform:translateY(-2px)}
a.subject .top{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);font-weight:550}
a.subject .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
a.subject h2{font-size:1.2rem;font-weight:620;margin:6px 0 0}
a.subject .desc{color:var(--muted);font-size:.9rem}
a.subject .most{font-size:.86rem;color:var(--ink2);margin-top:8px}
a.subject .most b{font-weight:600}
a.subject .prog{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
a.subject .prog i{display:block;height:100%;width:0;background:var(--c);border-radius:99px}
a.subject .status{font-size:.8rem;color:var(--muted);margin-top:8px}
.howto{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.9rem;max-width:68ch}
.howto b{color:var(--ink2);font-weight:600}
</style></head>
<body>
<header class="bar"><div class="in"><a class="back" href="index.html">&larr; Matérias</a>
<nav class="tabs" id="tabs"></nav>

<div class="hero"><div class="in"><h1 id="h-title"></h1><p id="h-sub"></p></div></div>
<main id="app"></main>
<script>window.EXAM = {
  id: "redes",
  title: "Redes de Computadores II",
  subtitle: "Prof. Luiz Guilherme Spolador · Endereçamento IP, máscara, CIDR e sub-redes",

  disclaimer: "**Aviso do professor em aula:** focar principalmente no **slide 6 (sub-redes)** — é o que provavelmente vai cair — e também no **slide 5 (IP)**. Por isso o banco tem 30 questões só de cálculo de sub-rede e o assunto aparece com 99% de chance. \n\n**O que o slide 6 (o arquivo “IMPORTANTE”) traz:** o método do **salto** (256 − octeto da máscara), a tabela de consulta rápida (/24 a /30), rede/broadcast/faixa de hosts, as “3 regras de ouro” (não existe sub-rede ímpar, broadcast nunca é par na parte que varia, rede e broadcast não são atribuíveis) e os desafios de IP 192.168.0.20/26 e 172.16.40.30/255.255.192.0. As questões repetem esses cenários. Prova de redes costuma pedir: rede, broadcast, faixa de hosts, nº de sub-redes e nº de hosts. Não achei provas antigas da Multivix publicadas; usei o padrão de bancos de questões de redes/concursos.",
  topics: [

    { id: "cidr", name: "CIDR e máscaras (/n)", src: "Slides 5 e 6", prob: 92, why: "/24 ↔ 255.255.255.0, tabela /24 a /30, exemplo da /23 (255.255.254.0), máscara válida." },
    { id: "bin", name: "Binário e octetos", src: "Slides 5 e 6", prob: 78, why: "Pesos 128, 64, 32, 16, 8, 4, 2, 1. “Aquecimento binário” do slide 6. Base de todo o cálculo." },
    { id: "mask", name: "Máscara, gateway e roteador", src: "Slide 5", prob: 82, why: "Exemplos do slide 5: 192.168.1.10 → Google 8.8.8.8; Rede A x Rede B; máscara errada." },
    { id: "class", name: "Classes, IPs privados e tipos de comunicação", src: "Slide 5", prob: 72, why: "Faixas A–E, privados (10 / 172.16–31 / 192.168), unicast, broadcast, multicast, multihomed." },
    { id: "ipbase", name: "Endereço IPv4: conceitos básicos", src: "Slide 5", prob: 66, why: "32 bits, 4 octetos, ID de rede x ID de host, DHCP." }
  ],
  plan: [
    "**Primeiro:** slide 6. Decore a **tabela /24 a /30** e faça a aba **Prática** (5 exercícios resolvidos passo a passo) com lápis e papel.",
    "**Depois:** simulado **por assunto** em “Cálculo de sub-redes” até acertar 90%. Em seguida, revise o slide 5 (classes, máscara, gateway) e faça o completo em modo prova.",
    "**Na prova:** sempre faça nesta ordem — (1) prefixo → máscara, (2) octeto misto, (3) salto = 256 − máscara, (4) em qual bloco o IP cai, (5) rede, broadcast = próxima rede − 1, hosts = rede+1 até broadcast−1."
  ],
  questions: [
    // ============ BINÁRIO ============
    ["bin", "Qual é o valor decimal do octeto `11100000`?",
      ["192", "224", "240", "248"], 1,
      "Some os pesos dos bits 1: 128 + 64 + 32 = **224**. Os três primeiros bits valem 1; os demais 0. É um octeto muito comum em máscaras (255.255.255.224 = /27).",
      "Cada bit é uma “chave” com um peso: 128, 64, 32, 16, 8, 4, 2, 1. Ligou, soma.",

    ["bin", "No IP 192.168.1.1, o segundo octeto (168) em binário é:",
      ["10101000", "10100100", "11000100", "10101100"], 0,
      "168 = 128 + 32 + 8 → **10101000**. O IP completo fica 11000000.10101000.00000001.00000001.",
      "Decompor em potências de 2 é como dar troco com as notas maiores primeiro.",
      ["", "= 128+32+4 = 164.", "= 128+64+4 = 196.", "= 128+32+8+4 = 172."]],
    ["bin", "Por que cada número de um endereço IPv4 só varia de 0 a 255?",
      ["Porque o IP tem 255 hosts", "Porque cada octeto tem 8 bits, o que dá 2⁸ = 256 valores (0 a 255)", "Porque 255 é o número de redes possíveis", "Porque os roteadores só aceitam até 255 conexões"], 1,
      "Cada grupo é um **octeto (byte) de 8 bits**: 00000000 (0) até 11111111 (255).",
      "Um odômetro de 8 casas binárias: vai de tudo desligado a tudo ligado.",
      ["Nada a ver com quantidade de hosts.", "", "Não é número de redes.", "Não é limite de conexões."]],
    ["bin", "O valor decimal de `11111000` é:",
      ["240", "248", "252", "254"], 1,
      "128 + 64 + 32 + 16 + 8 = **248**. É o último octeto da máscara 255.255.255.248 (/29).",
      "Cinco chaves ligadas da esquerda: 128+64+32+16+8.",
      ["240 = 11110000.", "", "252 = 11111100.", "254 = 11111110."]],

    // ============ IP BASE ============
    ["ipbase", "O endereço IPv4 é um número inteiro de ____ bits, o que permite aproximadamente ____ endereços.",
      ["16 bits / 65 mil", "32 bits / 4,3 bilhões", "64 bits / 18 quintilhões", "128 bits / 340 undecilhões"], 1,
      "IPv4 = **32 bits** → 2³² ≈ **4,3 bilhões** de endereços. (128 bits é o IPv6.)",
      "32 chaves ligadas/desligadas: cada combinação é um endereço único.",
      ["Isso seria 2¹⁶.", "", "Não é IPv4.", "Isso é IPv6."]],
    ["ipbase", "Qual dos endereços abaixo **NÃO** é um IPv4 válido?",
      ["10.0.0.1", "172.16.254.1", "192.168.1.256", "8.8.8.8"], 2,
      "Cada octeto vai de 0 a 255. **256 é inválido** (precisaria de 9 bits).",
      "Um relógio que marca 25 horas: não existe.",
      ["Válido.", "Válido.", "", "Válido (DNS do Google do slide)."]],
    ["ipbase", "Todo endereço IP é dividido em duas partes. Na analogia do slide, o **ID de rede** e o **ID de host** correspondem, respectivamente, a:",
      ["Número da casa / CEP da rua", "CEP da rua / número da casa", "Nome do bairro / nome do morador", "Telefone / endereço"], 1,
      "**ID de rede = CEP (rua):** todos na mesma rede compartilham. **ID de host = número da casa:** identifica o dispositivo dentro da rede.",

      ["Está invertido.", "", "Não é a analogia do slide.", "Não é a analogia do slide."]],
    ["ipbase", "Como um endereço IP pode ser configurado em um dispositivo?",
      ["Somente manualmente", "Somente pelo provedor de internet", "Manualmente ou automaticamente (via DHCP)", "Somente por cabo"], 2,
      "O IP pode ser configurado **manual ou automaticamente (DHCP)** nas configurações de rede de qualquer dispositivo.",

      ["“Somente” é pista de errada.", "“Somente” é pista de errada.", "", "Não tem relação com o meio físico."]],

    // ============ MÁSCARA / GATEWAY / ROTEADOR ============
    ["mask", "Qual a função da **máscara de sub-rede**?",
      ["Criptografar o endereço IP", "Informar qual parte do IP é o ID de rede (bits 1) e qual é o ID de host (bits 0)", "Atribuir IPs automaticamente", "Limitar a velocidade da rede"], 1,
      "A máscara tem 32 bits como o IP e funciona como um **filtro/gabarito**: bits **1 = rede**, bits **0 = host**. Assim o dispositivo sabe quem está na sua “vizinhança”.",
      "Gabarito de prova: onde tem 255, o número do IP é “da rua”; onde tem 0, é “da casa”.",
      ["Não criptografa.", "", "Isso é o DHCP.", "Não controla velocidade."]],
    ["mask", "Um host tem IP 192.168.1.10 e máscara 255.255.255.0. Qual é o ID de rede e qual é o ID de host?",
      ["Rede 192.168.1 / host .10", "Rede 192 / host 168.1.10", "Rede 192.168 / host 1.10", "Rede 192.168.1.10 / host nenhum"], 0,
      "A máscara tem 255 nos três primeiros octetos → rede = **192.168.1**. O 0 no quarto octeto → host = **.10**.",
      "255 “trava” o octeto como parte da rede.",
      ["", "Só um octeto seria de rede (máscara 255.0.0.0).", "Dois octetos seria máscara 255.255.0.0.", "Sem bits de host a rede não teria máquinas."]],
    ["mask", "Um PC tem IP 192.168.1.10, máscara 255.255.255.0 e gateway 192.168.1.1. Ao enviar um pacote para 8.8.8.8, o que ele faz?",
      ["Envia diretamente para 8.8.8.8, pois a máscara permite", "Percebe que 8.8.8.8 não está na rede 192.168.1.0 e envia o pacote ao gateway 192.168.1.1", "Descarta o pacote", "Envia o pacote por broadcast a toda a rede"], 1,
      "Pela máscara, o PC vê que 8.8.8.8 é de **outra rede** → entrega ao **gateway padrão**, que sabe encaminhá-lo para a internet.",
      "Carta para outra cidade: você não entrega, deixa na agência dos Correios (gateway).",
      ["8.8.8.8 não pertence à rede local.", "", "O gateway existe justamente para isso.", "Broadcast é só para a própria rede."]],
    ["mask", "O **gateway padrão** é:",
      ["O servidor DNS da rede", "O endereço IP do roteador na rede local, que serve de porta de saída para outras redes, inclusive a internet", "O endereço de broadcast", "A máscara de sub-rede"], 1,
      "Gateway padrão = **IP do roteador na rede local**; é para ele que o host envia pacotes cujo destino está fora da rede.",
      "A portaria do condomínio: tudo que sai ou entra passa por ela.",
      ["DNS traduz nomes em IPs.", "", "Broadcast é o último IP da rede.", "A máscara é outra configuração."]],
    ["mask", "O PC 192.168.1.5/24 (Rede A) quer falar com o PC 192.168.2.10/24 (Rede B). Qual afirmação está correta?",
      ["Eles se comunicam diretamente, pois ambos estão na rede 192.168", "Estão em sub-redes diferentes e só se comunicam através de um roteador", "Precisam de um switch, e não de roteador", "Só se comunicam se o DHCP estiver desligado"], 1,
      "Com /24, as redes são 192.168.1.0 e 192.168.2.0 — **redes lógicas diferentes**. A comunicação entre elas só ocorre via **roteador**, que tem uma interface em cada rede (ex.: .1.1 e .2.1) e consulta sua tabela de roteamento.",
      "Ruas diferentes: para ir de uma à outra você precisa passar pela esquina (roteador).",
      ["Só o 192.168 é igual; o terceiro octeto também faz parte da rede (máscara /24).", "", "Um switch só liga dispositivos da mesma rede.", "DHCP não é o fator."]],
    ["mask", "O PC 192.168.1.10 tem máscara **255.255.255.128** (configurada errada; o correto era 255.255.255.0). Ele tenta falar diretamente com o vizinho 192.168.1.200. O que acontece?",
      ["Funciona normalmente", "Com /25, o .200 fica em outra sub-rede (128–255); o PC acha que o destino está fora da rede e envia ao gateway em vez de falar diretamente", "O IP do PC deixa de existir", "O PC passa a ser Classe B"], 1,
      "Com 255.255.255.128 (/25), o bloco do .10 é 0–127. O .200 pertence ao bloco 128–255, ou seja, **outra sub-rede**. A máscara errada muda a decisão “é local ou vai para o gateway?”.",
      "Como colocar a fronteira da vizinhança no lugar errado: seu vizinho de porta vira “estrangeiro”.",
      ["A máscara errada muda quem é vizinho.", "", "O IP continua, mas a leitura de rede muda.", "A classe é determinada pelo primeiro octeto; a máscara não muda isso."]],

    // ============ CLASSES ============
    ["class", "O IP 130.45.2.9 pertence a qual classe e qual a máscara padrão dessa classe?",
      ["Classe A — 255.0.0.0", "Classe B — 255.255.0.0", "Classe C — 255.255.255.0", "Classe D — 255.255.255.255"], 1,
      "A classe vem do **primeiro octeto**: A 0–127, **B 128–191**, C 192–223, D 224–239, E 240–255. 130 → **B**, máscara padrão 255.255.0.0.",
      "Decore: A < 128 ≤ B < 192 ≤ C < 224 ≤ D < 240 ≤ E.",
      ["A vai até 127.", "", "C começa em 192.", "D é multicast e não tem máscara padrão de rede."]],
    ["class", "Qual dos IPs abaixo é de **Classe C**?",
      ["10.0.0.1", "172.16.0.1", "200.10.5.1", "230.1.1.1"], 2,
      "Classe C: primeiro octeto de 192 a 223 → **200.10.5.1**. 10 é A; 172 é B; 230 é D.",
      "O primeiro octeto é o “crachá” da classe.",
      ["Classe A.", "Classe B.", "", "Classe D (multicast)."]],
    ["class", "Um endereço como 230.0.0.5 é de qual classe e para que serve?",
      ["Classe C, para redes pequenas", "Classe D, reservada para multicast (comunicação de um para muitos)", "Classe E, uso experimental", "Classe A, redes gigantes"], 1,
      "**Classe D = 224–239 = multicast**: um host envia um pacote que é entregue a todos que “assinaram” aquele endereço (streaming, jogos online, atualização de rotas). **Classe E (240–255)** = experimental.",
      "Canal de TV: a emissora transmite uma vez e só quem sintonizou recebe.",
      ["C é 192–223.", "", "E começa em 240.", "A é 0–127."]],
    ["class", "Qual dos endereços abaixo está dentro de uma faixa de **IP privado**?",
      ["172.32.0.1", "192.169.1.1", "172.20.4.5", "11.0.0.1"], 2,
      "Faixas privadas: **10.0.0.0–10.255.255.255**, **172.16.0.0–172.31.255.255** e **192.168.0.0–192.168.255.255**. 172.20.4.5 está entre 172.16 e 172.31.",
      "Memorize “10 inteiro, 172 de 16 a 31, 192.168 inteiro”.",
      ["172.32 já saiu da faixa (vai só até 172.31).", "Só 192.168 é privado, não 192.169.", "", "Só 10 é privado, não 11."]],
    ["class", "Um PC envia uma requisição ARP para 192.168.1.255, que é entregue a todos os dispositivos da rede. Esse tipo de comunicação é:",
      ["Unicast", "Broadcast", "Multicast", "Multihomed"], 1,
      "**Broadcast** = para todos da rede (ex.: ARP para o último endereço da sub-rede). **Unicast** = ponto a ponto (PC1 → PC2). **Multicast** = para um grupo específico (IPTV).",
      "Unicast = ligação; broadcast = grito na sala; multicast = grupo de WhatsApp.",
      ["Unicast é de um para um.", "", "Multicast é só para quem assinou o grupo.", "Multihomed é um dispositivo com várias interfaces, não um tipo de envio."]],
    ["class", "Um servidor tem uma placa de rede ligada à rede interna (192.168.1.100) e outra ligada a outra rede, para redundância ou balanceamento de carga. Esse dispositivo é chamado:",
      ["Multicast", "Multihomed", "Gateway padrão", "Broadcast"], 1,
      "**Multihomed** = dispositivo (servidor/roteador) com **múltiplas interfaces** ligadas a redes diferentes; usado para redundância ou balanceamento.",
      "Prédio com duas portarias em ruas diferentes: se uma fecha, entra pela outra.",
      ["Multicast é tipo de envio.", "", "Gateway é a saída da rede.", "Broadcast é tipo de envio."]],

    // ============ CIDR ============
    ["cidr", "Por que o CIDR foi criado, segundo a aula?",
      ["Para criptografar o tráfego", "Porque o sistema de classes era rígido e ineficiente: uma empresa que precisasse de 500 endereços recebia um bloco Classe B (65.534) e desperdiçava mais de 65 mil, acelerando o esgotamento do IPv4", "Para aumentar o número de octetos do IP", "Para substituir o DHCP"], 1,
      "Classes A/B/C só ofereciam blocos de tamanhos fixos. O **CIDR** aboliu as classes e permitiu **máscaras de tamanho variável (VLSM)**, alocando blocos conforme a necessidade real.",
      "Alugar um galpão de 65 mil m² só porque você precisa de 500: o CIDR permite alugar o tamanho certo.",
      ["Nada a ver com criptografia.", "", "O IP continua com 4 octetos.", "Não substitui o DHCP."]],
    ["cidr", "A máscara 255.255.255.192 equivale, em notação CIDR, a:",
      ["/24", "/25", "/26", "/27"], 2,
      "255.255.255 = 24 bits; o octeto 192 = 11000000 = 2 bits 1. Total = **26 bits** → **/26**.",
      "Conte os “1” da máscara em binário.",
      ["/24 é 255.255.255.0.", "/25 é 255.255.255.128.", "", "/27 é 255.255.255.224."]],
    ["cidr", "Qual é a máscara decimal correspondente a **/27**?",
      ["255.255.255.192", "255.255.255.224", "255.255.255.240", "255.255.255.248"], 1,
      "/27 = 24 + 3 bits no último octeto → 11100000 = **224**: **255.255.255.224**.",
      "/25 → 128, /26 → 192, /27 → 224, /28 → 240, /29 → 248, /30 → 252.",
      ["Isso é /26.", "", "Isso é /28.", "Isso é /29."]],
    ["cidr", "Qual a quantidade de hosts utilizáveis em uma rede com máscara **255.255.254.0 (/23)**?",
      ["254", "510", "512", "1022"], 1,
      "/23 → 9 bits de host → 2⁹ = 512 endereços − 2 (rede e broadcast) = **510**. (Em /24: 2⁸ − 2 = 254.)",
      "A /23 é como juntar duas ruas vizinhas num único condomínio: dobra o tamanho.",
      ["Isso é de um /24.", "", "512 é o total de endereços, não os utilizáveis.", "Isso seria /22."]],
    ["cidr", "Com a máscara 255.255.254.0, dois computadores 192.168.0.50 e 192.168.1.100 podem se comunicar sem roteador?",
      ["Não, pois o terceiro octeto é diferente", "Sim, pois a máscara /23 une 192.168.0.0/24 e 192.168.1.0/24 em uma única rede lógica", "Não, pois são IPs de classes diferentes", "Sim, mas só se estiverem no mesmo switch e com DHCP"], 1,
      "Com /23, a rede é 192.168.0.0 com hosts de 192.168.0.1 a 192.168.1.254 e broadcast 192.168.1.255. Os dois IPs estão **na mesma rede** → comunicação direta.",
      "A máscara “pega emprestado” um bit da rede e entrega ao host, alargando a rua.",
      ["Em /24 seria verdade; em /23 o último bit do 3º octeto virou host.", "", "Ambos são Classe C pelo 1º octeto.", "O motivo é a máscara, não o switch/DHCP."]],
    ["cidr", "Qual é o endereço de broadcast da rede 192.168.0.0 com máscara 255.255.254.0?",
      ["192.168.0.255", "192.168.1.255", "192.168.255.255", "192.168.2.255"], 1,
      "/23 junta 0.0 e 1.0: rede **192.168.0.0**, hosts 192.168.0.1 → 192.168.1.254, broadcast **192.168.1.255** (último endereço antes da próxima rede, 192.168.2.0).",
      "Broadcast = “última casa da rua grande”.",
      ["Seria de um /24.", "", "Seria de um /16.", "Já pertence à rede seguinte."]],
    ["cidr", "O que é o **VLSM** associado ao CIDR?",
      ["Um protocolo de roteamento da camada física", "O uso de máscaras de sub-rede de tamanho variável, definindo bit a bit a porção de rede", "Uma classe de endereços IP", "Um tipo de cabo"], 1,
      "CIDR aboliu as classes e introduziu máscaras de **tamanho variável (VLSM)**, ex.: /24, /26, /23, em vez de apenas 255.0.0.0, 255.255.0.0 e 255.255.255.0.",
      "Antes, só havia camisas P, M e G (classes). Com CIDR, a roupa é feita sob medida.",
      ["Não é protocolo físico.", "", "Não é classe.", "Não é cabo."]],
    ["cidr", "Quantos bits de **host** existem em uma máscara 255.255.254.0?",
      ["8", "9", "10", "23"], 1,
      "32 − 23 = **9 bits de host** (a máscara tem 23 bits 1). Isso dá 2⁹ = 512 endereços totais.",
      "Prefixo + bits de host = 32 sempre.",
      ["Isso é de /24.", "", "Isso é de /22.", "23 é o número de bits de **rede**."]],

    // ============ SUB-REDES ============
    ["sub", "Quantos hosts **utilizáveis** existem em uma sub-rede /26?",
      ["64", "62", "60", "30"], 1,
      "h = 32 − 26 = 6 bits de host → 2⁶ = 64 endereços totais. Menos rede e broadcast = **62**.",
      "Prédio de 64 apartamentos em que 2 são da administração (rede e broadcast).",
      ["64 é o total de endereços, não os utilizáveis.", "", "Descontou demais.", "30 é o de /27."]],
    ["sub", "Quantos hosts **utilizáveis** tem uma sub-rede /27?",
      ["32", "30", "28", "62"], 1,
      "h = 5 → 2⁵ = 32 endereços; utilizáveis = 32 − 2 = **30**. (Pegadinha clássica: confundir 32 com 30.)",
      "Sempre descontar os 2 “intocáveis”.",
      ["32 é o total.", "", "Descontou 4.", "62 é de /26."]],
    ["sub", "Quantos hosts utilizáveis (e qual o incremento/salto) em uma sub-rede /28 (255.255.255.240)?",
      ["16 hosts, salto 14", "14 hosts, salto 16", "30 hosts, salto 32", "6 hosts, salto 8"], 1,
      "h = 4 → 16 endereços → **14 hosts**; salto = 256 − 240 = **16**.",
      "Salto = tamanho do bloco = 2^h.",
      ["Trocou os valores.", "", "É de /27.", "É de /29."]],
    ["sub", "Para ligar dois roteadores por um link ponto a ponto, que precisa de apenas 2 endereços utilizáveis, qual prefixo desperdiça menos endereços?",
      ["/28", "/29", "/30", "/24"], 2,
      "/30 → h = 2 → 4 endereços, **2 utilizáveis**. Máscara 255.255.255.252, salto 4.",
      "Mesa para dois: nem mais, nem menos.",
      ["/28 tem 14 hosts.", "/29 tem 6 hosts.", "", "/24 tem 254."]],
    ["sub", "Dividindo a rede 192.168.10.0/24 em sub-redes /26, obtêm-se quantas sub-redes e quantos hosts utilizáveis em cada uma?",
      ["2 sub-redes com 126 hosts", "4 sub-redes com 62 hosts", "8 sub-redes com 30 hosts", "4 sub-redes com 64 hosts"], 1,
      "Bits emprestados = 26 − 24 = 2 → 2² = **4 sub-redes**, cada uma com 64 endereços (**62 hosts**). Confira: 4 × 64 = 256.",
      "Cortar uma barra de chocolate de 256 quadradinhos em 4 pedaços de 64.",
      ["Isso é /25.", "", "Isso é /27.", "64 é total, não utilizáveis."]],
    ["sub", "Dividindo uma rede /24 em sub-redes /27, quantas sub-redes são geradas?",
      ["4", "8", "16", "32"], 1,
      "27 − 24 = 3 bits emprestados → 2³ = **8 sub-redes** (de 32 endereços cada, 30 hosts).",
      "Quantidade = 2^(prefixo novo − prefixo original).",
      ["Isso é /26.", "", "Isso é /28.", "Isso é /29."]],
    ["sub", "Qual é o tamanho do salto (incremento) para a máscara 255.255.255.224?",
      ["16", "32", "64", "224"], 1,
      "Salto = 256 − octeto da máscara = 256 − 224 = **32**. Redes começam em .0, .32, .64, .96, .128, .160, .192, .224.",
      "Fórmula mágica do slide: 256 − [valor do octeto misto].",
      ["É de /28 (240).", "", "É de /26 (192).", "224 é o octeto da máscara, não o salto."]],
    ["sub", "Para o host 192.168.10.130/26, qual é o endereço de **broadcast** da sua sub-rede?",
      ["192.168.10.127", "192.168.10.191", "192.168.10.190", "192.168.10.255"], 1,
      "Salto 64 → blocos .0, .64, .128, .192. 130 está no bloco 128. Rede **.128**; próxima rede .192; broadcast = .192 − 1 = **.191**. Faixa de hosts: .129 a .190.",
      "O broadcast é sempre “o último antes da próxima rede”.",
      ["É o broadcast do bloco anterior (0–127).", "", "É o último **host**, não o broadcast.", "É o broadcast do /24 inteiro."]],
    ["sub", "Um computador usa 192.168.0.20/26. Qual IP você pode atribuir a uma nova máquina **na mesma sub-rede, sem usar roteador**?",
      ["192.168.0.140", "192.168.0.55", "192.168.0.99", "192.168.0.63"], 1,
      "Máscara /26 → salto 64. 192.168.0.20 está na rede 0 (hosts .1 a .62, broadcast .63). Só **.55** cabe. .63 é o **broadcast** (não atribuível); .99 e .140 estão em outras sub-redes.",
      "O vizinho precisa estar na mesma rua e não pode ocupar a casa da administração (.0 e .63).",
      ["Está na sub-rede 128–191.", "", "Está na sub-rede 64–127.", "É o endereço de broadcast: não pode ser atribuído a um host."]],
    ["sub", "O IP 172.16.40.30 com máscara 255.255.192.0 pertence a uma sub-rede cujo endereço de **broadcast** é:",
      ["172.16.255.255", "172.16.127.255", "172.16.63.255", "172.16.40.255"], 2,
      "Octeto misto = 3º (192). Salto = 256 − 192 = 64. Blocos do 3º octeto: 0, 64, 128, 192. O 40 cai no bloco 0–63 → rede 172.16.**0**.0; próxima rede 172.16.64.0; broadcast = **172.16.63.255**.",
      "Mesmo método do /26, só que “subiu” um octeto.",
      ["É o broadcast da rede /16 inteira.", "É o broadcast do bloco 64–127.", "", "Não é fim de bloco."]],
    ["sub", "Para 172.16.40.30 com máscara 255.255.192.0, qual é a faixa de hosts **utilizáveis**?",
      ["172.16.0.0 a 172.16.63.255", "172.16.0.1 a 172.16.63.254", "172.16.0.1 a 172.16.127.254", "172.16.40.1 a 172.16.40.254"], 1,
      "Rede 172.16.0.0, broadcast 172.16.63.255. Hosts = rede+1 até broadcast−1: **172.16.0.1 a 172.16.63.254**.",
      "Tire os dois “intocáveis” das pontas.",
      ["Inclui rede e broadcast.", "", "Seria de uma /17.", "Não respeita o bloco."]],
    ["sub", "Uma máscara de sub-rede termina com o octeto .192 (em uma rede Classe C). Quais são, respectivamente, o tamanho do bloco, o número de sub-redes e os hosts válidos por sub-rede?",
      ["32, 8 e 30", "64, 4 e 62", "128, 2 e 126", "64, 4 e 64"], 1,
      "Salto = 256 − 192 = **64**. Sub-redes = 256 ÷ 64 = **4** (ou 2² bits). Hosts válidos = 64 − 2 = **62**. (Desafio final do slide.)",
      "Fórmulas de diagnóstico: Salto = 256 − octeto; Sub-redes = 256 ÷ salto; Hosts = salto − 2.",
      ["Isso é /27.", "", "Isso é /25.", "Esqueceu de tirar rede e broadcast."]],
    ["sub", "Em uma sub-rede /26 de 192.168.5.0/24, qual endereço abaixo pode ser um **endereço de rede** válido?",
      ["192.168.5.65", "192.168.5.96", "192.168.5.64", "192.168.5.127"], 2,
      "Redes de /26 começam em múltiplos de 64: .0, **.64**, .128, .192. Regra de ouro: não existe sub-rede ímpar (e .96 não é múltiplo de 64).",
      "Se a prova oferecer rede terminada em número ímpar, elimine direto.",
      ["Ímpar — não pode ser rede.", ".96 é par, mas não é múltiplo de 64 (seria endereço de host).", "", "É um possível broadcast (127 = 128 − 1)."]],
    ["sub", "Em uma sub-rede /26 do bloco 192.168.1.0/24, qual endereço abaixo pode ser **broadcast**?",
      ["192.168.1.100", "192.168.1.127", "192.168.1.128", "192.168.1.64"], 1,
      "Broadcast = próxima rede − 1: .63, **.127**, .191, .255. Regra de ouro: o broadcast é sempre **ímpar** na parte que varia (63, 127, 191, 255).",
      "Se a rede é par, o endereço logo antes dela é ímpar.",
      ["Não é fim de bloco.", "", "É endereço de rede (começo do bloco).", "É endereço de rede."]],
    ["sub", "Na sub-rede 10.0.0.0/24, quais endereços **não** podem ser atribuídos a computadores (“os 2 intocáveis”)?",
      ["10.0.0.1 e 10.0.0.254", "10.0.0.0 e 10.0.0.255", "10.0.0.0 e 10.0.0.1", "10.0.0.254 e 10.0.0.255"], 1,
      "O **primeiro IP (ID de rede)** e o **último (broadcast)** são reservados: **10.0.0.0** e **10.0.0.255**. O de rede dá nome à rede; o de broadcast envia mensagens em massa.",
      "O 1º é a placa na entrada do condomínio; o último é o alto-falante.",
      ["São hosts válidos.", "", ".1 é host válido.", ".254 é host válido."]],
    ["sub", "Qual é o endereço de broadcast da sub-rede do host 192.168.10.77/28?",
      ["192.168.10.64", "192.168.10.79", "192.168.10.78", "192.168.10.95"], 1,
      "/28 → salto 16. Blocos: 64, 80, … 77 está no bloco 64–79. Rede **.64**, hosts .65 a .78, broadcast **.79**.",
      "Passos: salto → em que bloco cai → próxima rede − 1.",
      ["É o endereço de rede.", "", "É o último host.", "É o broadcast do bloco 80–95."]],
    ["sub", "Qual é o endereço de **rede** do host 156.72.34.125 com máscara 255.255.255.224?",
      ["156.72.34.64", "156.72.34.96", "156.72.34.112", "156.72.34.128"], 1,
      "Salto = 256 − 224 = 32. Blocos: …, 64, 96, 128… O 125 está entre 96 e 127 → rede **156.72.34.96**, broadcast .127.",
      "Divida 125 por 32 → 3 (96 = 3 × 32).",
      ["64–95 é o bloco anterior.", "", "112 não é múltiplo de 32.", "128 é a rede seguinte (125 < 128)."]],
    ["sub", "Para o IP 10.20.30.77/20, qual é o endereço de **broadcast** da sub-rede?",

<script>/* Motor de simulado — compartilhado pelos 4 sites */
(function () {
  const E = window.EXAM;
  const LET = "ABCDEFG";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const md = (s) =>
    esc(s == null ? "" : s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\n/g, "<br>");

  // normaliza perguntas: [topico, enunciado, opcoes, correta, explicacao, analogia, porQueErrado[], codigo]
  // gira as alternativas de forma fixa por questão, para a letra certa não ficar sempre na mesma posição
  const Q = E.questions.map((a, i) => {
    let o = a[2], ans = a[3], w = a[6] || [];
    const n = o.length, r = (i * 7 + 3) % n;
    if (r) { const rot = (arr) => arr.map((_, k) => arr[(k + r) % n]); o = rot(o); w = w.length ? rot(w) : w; ans = (ans - r + n) % n; }
    return { i, t: a[0], q: a[1], o, a: ans, e: a[4], an: a[5], w, c: a[7] || "", bonus: a[0] === "extra" };
  });
  const T = {};
  E.topics.forEach((t) => (T[t.id] = t));
  const lvl = (p) => (p >= 85 ? ["hot", "Muito alta"] : p >= 70 ? ["high", "Alta"] : p >= 50 ? ["mid", "Média"] : ["low", "Baixa"]);

  // ---------- persistência ----------
  const KEY = "sim_" + E.id;
  let store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || { q: {}, hist: [] }; } catch (e) { return { q: {}, hist: [] }; } })();
  const save = () => { store.total = Q.length; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  const record = (i, ok) => { const p = store.q[i] || { n: 0 }; store.q[i] = { ok, n: p.n + 1 }; save(); };

  // ---------- estado ----------
  let view = "home";
  let S = null; // sessão do quiz
  const app = $("#app");
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- navegação ----------
  function nav() {
    const tabs = [["home", "Prioridades"], ["setup", "Simulado"], ["cheat", "Resumão"]];
    if (E.practice) tabs.push(["practice", E.practiceTab || "Prática"]);
    const cur = view === "quiz" || view === "result" ? "setup" : view;
    $("#tabs").innerHTML = tabs.map(([k, n]) => `<button class="${k === cur ? "on" : ""}" data-go="${k}">${n}</button>`).join("");
  }
  function go(v) { view = v; render(); window.scrollTo(0, 0); }
  function render() { nav(); ({ home, setup, quiz, result, cheat, practice })[view](); }

  // ---------- estatísticas ----------
  function topicStats(id) {
    const qs = Q.filter((q) => q.t === id);
    const done = qs.filter((q) => store.q[q.i]);
    const ok = done.filter((q) => store.q[q.i].ok).length;
    return { total: qs.length, done: done.length, ok, acc: done.length ? ok / done.length : null };
  }

  // ---------- INÍCIO ----------
  function home() {
    const answered = Object.keys(store.q).length;
    const right = Object.values(store.q).filter((x) => x.ok).length;
    const rows = E.topics.map((t) => ({ t, s: topicStats(t.id) }));
    const prio = rows.slice().sort((a, b) => b.t.prob * (1 - (b.s.acc ?? 0) * 0.9) - a.t.prob * (1 - (a.s.acc ?? 0) * 0.9)).slice(0, 3);
    app.innerHTML = `
    <div class="card"><p style="margin:0;color:var(--ink2)">${md(E.intro)}</p>
      ${E.disclaimer ? `<div class="callout">${md(E.disclaimer)}</div>` : ""}</div>
    <div class="card stats">
      <div><b>${Q.length}</b><span>questões no banco</span></div>
      <div><b>${answered}</b><span>já respondidas</span></div>
      <div><b>${answered ? Math.round((right / answered) * 100) + "%" : "—"}</b><span>de acerto${answered ? ` · ${right} certas, ${answered - right} erradas` : ""}</span></div>
    </div>
    <div class="card"><h2>Por onde começar</h2>
      <p class="muted small" style="margin:-4px 0 14px">Ordenado por chance de cair e pelo quanto você ainda erra.</p>
      <div class="row">${prio.map((r) => `<button class="btn ghost" data-topic="${r.t.id}">${r.t.name}</button>`).join("")}</div></div>
    <div class="card"><h2>Mapa de probabilidade por assunto</h2>
      <table class="topics"><tr><th>Assunto</th><th>Chance de cair</th><th class="hide-s">Seu acerto</th><th></th></tr>
      ${rows.map(({ t, s }) => { const [cls, lab] = lvl(t.prob); return `
        <tr><td><div class="tname">${t.name}${t.src ? `<span class="src ${t.focus ? "focus" : ""}">${t.focus ? t.src + " · foco do professor" : t.src}</span>` : ""}</div>
          <div class="twhy">${md(t.why)}</div><div class="pct">${s.total} questões</div></td>
        <td style="min-width:128px"><span class="lvl ${cls}">${lab}</span><div class="bar2"><i style="width:${t.prob}%"></i></div><div class="pct">~${t.prob}%</div></td>
        <td class="hide-s" style="min-width:112px">${s.acc == null ? '<span class="pct">não feito</span>' : `<div class="bar2 ${s.acc >= 0.7 ? "acc" : "bad"}"><i style="width:${s.acc * 100}%"></i></div><div class="pct">${s.ok}/${s.done} certas</div>`}</td>
        <td><button class="btn ghost sm" data-topic="${t.id}">Treinar</button></td></tr>`; }).join("")}
      </table></div>
    ${E.plan ? `<div class="card"><h2>Plano de estudo sugerido</h2><ol class="list">${E.plan.map((p) => `<li>${md(p)}</li>`).join("")}</ol></div>` : ""}
    ${store.hist.length ? `<div class="card"><h2>Seus últimos simulados</h2><ul class="list">${store.hist.slice(-6).reverse().map((h) => `<li>${h.d} · <b>${h.s}/${h.n}</b> (${Math.round((h.s / h.n) * 100)}%) · ${esc(h.m)}</li>`).join("")}</ul>
      <div style="margin-top:14px"><button class="btn ghost sm" data-act="reset">Apagar meu histórico</button></div></div>` : ""}`;
  }

  // ---------- MONTAR SIMULADO ----------
  let cfg = { mode: "full", topic: E.topics[0].id, feedback: "treino", sq: true, so: true };
  function setup() {
    const wrongs = Q.filter((q) => store.q[q.i] && !store.q[q.i].ok).length;
    const R = (name, val, cur, title, desc) => `<label class="opt-row ${cur === val ? "on" : ""}"><input type="radio" name="${name}" value="${val}" ${cur === val ? "checked" : ""}><div><b>${title}</b><div class="small muted">${desc}</div></div></label>`;
    app.innerHTML = `<div class="card"><h2>Montar simulado</h2>
      ${R("mode", "full", cfg.mode, `Completo · ${Q.length} questões`, "Todas as questões, como numa prova de verdade.")}
      ${R("mode", "top", cfg.mode, "Rápido · as 20 mais prováveis", "Questões dos assuntos com maior chance de cair. Bom para a véspera.")}
      ${R("mode", "topic", cfg.mode, "Por assunto", `<select id="tsel">${E.topics.map((t) => `<option value="${t.id}" ${t.id === cfg.topic ? "selected" : ""}>${t.name} (${Q.filter((q) => q.t === t.id).length})</option>`).join("")}</select>`)}
      ${R("mode", "wrong", cfg.mode, `Só as que eu errei · ${wrongs}`, wrongs ? "Refaz apenas as questões que você errou da última vez." : "Nada para refazer ainda. Faça um simulado primeiro.")}
      <h3>Modo</h3>
      ${R("fb", "treino", cfg.feedback, "Treino", "Mostra se acertou e explica na hora, a cada questão. Melhor para aprender.")}
      ${R("fb", "prova", cfg.feedback, "Prova", "Resultado e explicações só no final. Simula a pressão real.")}
      <label class="check" style="margin-top:14px"><input type="checkbox" id="sq" ${cfg.sq ? "checked" : ""}> Embaralhar a ordem das questões</label>
      <label class="check"><input type="checkbox" id="so" ${cfg.so ? "checked" : ""}> Embaralhar as alternativas (evita decorar a letra)</label>
      <div style="margin-top:18px"><button class="btn" data-act="start" ${cfg.mode === "wrong" && !wrongs ? "disabled" : ""}>Começar</button></div></div>`;
  }

  function buildList() {
    let l;
    if (cfg.mode === "full") l = Q.slice();
    else if (cfg.mode === "top") l = Q.slice().sort((a, b) => T[b.t].prob - T[a.t].prob || Math.random() - 0.5).slice(0, 20);
    else if (cfg.mode === "topic") l = Q.filter((q) => q.t === cfg.topic);
    else l = Q.filter((q) => store.q[q.i] && !store.q[q.i].ok);
    return cfg.sq ? shuffle(l) : l.sort((a, b) => a.i - b.i);
  }
  function startSession(list, label) {
    S = { list: list.map((q) => q.i), p: 0, ans: {}, ord: {}, fb: cfg.feedback, label, t0: Date.now() };
    S.list.forEach((i) => { const n = Q[i].o.length; const idx = [...Array(n).keys()]; S.ord[i] = cfg.so ? shuffle(idx) : idx; });
    go("quiz");
  }

  // ---------- QUESTÃO ----------
  function quiz() {
    const i = S.list[S.p], q = Q[i], ord = S.ord[i], picked = S.ans[i];
    const locked = S.fb === "treino" && picked != null;
    const [cls, lab] = lvl(T[q.t].prob);
    const n = S.list.length;
    app.innerHTML = `<div class="card">
      <div class="qhead"><span>Questão ${S.p + 1} de ${n} · ${esc(S.label)}</span><span id="clock"></span></div>
      <div class="progress"><i style="width:${(S.p / n) * 100}%"></i></div>
      <div class="tags"><span class="tag">${esc(T[q.t].name)}</span><span class="tag"><span class="lvl ${cls}">Chance ${lab.toLowerCase()}</span></span>${q.bonus ? '<span class="tag">bônus</span>' : ""}</div>
      <div class="qtext">${md(q.q)}</div>
      ${q.c ? `<pre class="code">${esc(q.c)}</pre>` : ""}
      <div id="opts">${ord.map((oi, k) => {
        let c = "opt";
        if (locked) { c += " lock"; if (oi === q.a) c += " ok"; else if (oi === picked) c += " no"; }
        else if (picked === oi) c += " sel";
        return `<button class="${c}" data-opt="${oi}"><span class="l">${LET[k]}</span><span>${md(q.o[oi])}</span></button>`;
      }).join("")}</div>
      <div class="fb" id="fb">${locked ? explain(q, picked) : ""}</div>
      <div class="row sp" style="margin-top:22px">
        <button class="btn ghost" data-act="prev" ${S.p === 0 ? "disabled" : ""}>Anterior</button>
        <button class="btn" data-act="next" ${S.fb === "treino" && picked == null ? "disabled" : ""}>${S.p === n - 1 ? "Finalizar" : "Próxima"}</button>
      </div></div>`;
    tick();
  }
  let clockT;
  function tick() {
    clearInterval(clockT);
    const f = () => { const el = $("#clock"); if (!el || !S) return clearInterval(clockT); const s = Math.floor((Date.now() - S.t0) / 1000); el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
    f(); clockT = setInterval(f, 1000);
  }

  function explain(q, picked) {
    const ord = S.ord[q.i] || q.o.map((_, k) => k);
    const L = (oi) => LET[ord.indexOf(oi)];
    let h = "";
    if (picked == null) h += `<div class="why bad"><span class="label">Sem resposta</span></div>`;
    else if (picked !== q.a) h += `<div class="why bad"><span class="label">Incorreta · você marcou ${L(picked)}</span><p>${md(q.w[picked] || "Não é a alternativa que o conteúdo da aula sustenta.")}</p></div>`;
    else h += `<div class="why good"><span class="label">Correta</span></div>`;
    h += `<div class="why good"><span class="label">Resposta certa</span><p class="ans">${L(q.a)}) ${md(q.o[q.a])}</p><p>${md(q.e)}</p></div>`;
    if (q.an) h += `<div class="an"><span class="label">Para fixar</span>${md(q.an)}</div>`;
    const others = q.o.map((_, k) => k).filter((k) => k !== q.a && k !== picked && q.w[k]);
    if (others.length) h += `<details><summary>Por que as outras alternativas estão erradas</summary><ul>${others.map((k) => `<li><b>${L(k)})</b> ${md(q.o[k])}<br><span class="muted">${md(q.w[k])}</span></li>`).join("")}</ul></details>`;
    return h;
  }

  function answer(oi) {
    const i = S.list[S.p], q = Q[i];
    if (S.fb === "treino") {
      if (S.ans[i] != null) return;
      S.ans[i] = oi; record(i, oi === q.a); quiz();
      const f = $("#fb"); if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else { S.ans[i] = oi; quiz(); }
  }

  function finish() {
    clearInterval(clockT);
    if (S.fb === "prova") S.list.forEach((i) => record(i, S.ans[i] === Q[i].a));
    const s = S.list.filter((i) => S.ans[i] === Q[i].a).length;
    store.hist.push({ d: new Date().toLocaleDateString("pt-BR") + " " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), s, n: S.list.length, m: S.label });
    save(); S.done = true; go("result");
  }

  // ---------- RESULTADO ----------
  function result() {
    const n = S.list.length, s = S.list.filter((i) => S.ans[i] === Q[i].a).length, pct = Math.round((s / n) * 100);
    const byT = {};
    S.list.forEach((i) => { const t = Q[i].t; byT[t] = byT[t] || { n: 0, s: 0 }; byT[t].n++; if (S.ans[i] === Q[i].a) byT[t].s++; });
    const wrongs = S.list.filter((i) => S.ans[i] !== Q[i].a);
    const msg = pct >= 90 ? "Excelente. Você está pronto." : pct >= 70 ? "Muito bom. Revise só os erros abaixo." : pct >= 50 ? "No caminho. Foque nos assuntos com barra vermelha." : "É para isso que serve o simulado. Leia as explicações e refaça só os erros.";
    app.innerHTML = `<div class="card"><div class="row" style="gap:28px;align-items:flex-end"><div><div class="score">${pct}%</div><div class="muted small" style="margin-top:6px">${s} de ${n} certas · ${Math.max(1, Math.round((Date.now() - S.t0) / 60000))} min</div></div><div style="flex:1;min-width:220px"><h2 style="margin:0;font-size:1.15rem">${msg}</h2></div></div>
      <hr class="hr"><div class="row"><button class="btn" data-act="redoWrong" ${wrongs.length ? "" : "disabled"}>Refazer só as erradas · ${wrongs.length}</button><button class="btn ghost" data-go="setup">Novo simulado</button><button class="btn ghost" data-go="home">Prioridades</button></div></div>
      <div class="card"><h2>Desempenho por assunto</h2><table class="topics">${Object.entries(byT).sort((a, b) => a[1].s / a[1].n - b[1].s / b[1].n).map(([t, v]) => `<tr><td style="padding:12px 12px 12px 0">${esc(T[t].name)}</td><td style="width:40%;padding:12px 12px 12px 0"><div class="bar2 ${v.s / v.n >= 0.7 ? "acc" : "bad"}" style="margin:0"><i style="width:${(v.s / v.n) * 100}%"></i></div></td><td style="text-align:right;padding:12px 0" class="tnum">${v.s}/${v.n}</td></tr>`).join("")}</table></div>
      ${wrongs.length ? `<div class="card rev"><h2>Revise o que você errou · ${wrongs.length}</h2>${wrongs.map((i) => { const q = Q[i]; return `<details open><summary>${esc(T[q.t].name)} · ${esc(q.q.slice(0, 90))}${q.q.length > 90 ? "…" : ""}</summary><div class="qtext" style="margin-top:14px">${md(q.q)}</div>${q.c ? `<pre class="code">${esc(q.c)}</pre>` : ""}${explain(q, S.ans[i])}</details>`; }).join("")}</div>` : `<div class="card"><h2>Gabarito perfeito</h2><p class="muted" style="margin:0">Nenhum erro neste simulado.</p></div>`}`;
  }

  // ---------- RESUMÃO ----------
  function cheat() {
    app.innerHTML = `<div class="card"><h2>Resumão para a véspera</h2><p class="muted small" style="margin:0">Tudo que mais cai, em uma página. Leia antes de dormir e de novo antes da prova.</p></div>` +
      E.cheat.map((s) => `<div class="card"><h2>${s.h}</h2>${s.pre ? `<pre class="code">${esc(s.pre)}</pre>` : ""}${(s.items || []).length ? `<ul class="list">${s.items.map((x) => `<li>${typeof x === "string" ? md(x) : x.html}</li>`).join("")}</ul>` : ""}</div>`).join("");
  }

  // ---------- PRÁTICA ----------
  function practice() {
    app.innerHTML = `<div class="card"><h2>${E.practiceName || "Prática"}</h2><p class="muted" style="margin:0">${md(E.practiceIntro || "")}</p></div>` +
      E.practice.map((p, k) => `<div class="card"><h3 style="margin-top:0">${k + 1}. ${md(p.t)}</h3><div style="color:var(--ink2)">${md(p.q)}</div>${p.pre ? `<pre class="code">${esc(p.pre)}</pre>` : ""}${p.hint ? `<details><summary>Dica</summary><p class="muted" style="margin:.5rem 0 0 14px">${md(p.hint)}</p></details>` : ""}
      <details><summary>Ver resolução</summary><div style="margin:.6rem 0 0 14px;color:var(--ink2)">${p.a ? `<p style="margin:0 0 8px">${md(p.a)}</p>` : ""}${p.code ? `<pre class="code">${esc(p.code)}</pre>` : ""}${p.after ? `<p style="margin:8px 0 0">${md(p.after)}</p>` : ""}</div></details></div>`).join("");
  }

  // ---------- eventos ----------
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-go],[data-act],[data-opt],[data-topic]");
    if (!b) return;
    if (b.dataset.go) return go(b.dataset.go);
    if (b.dataset.topic) { cfg.mode = "topic"; cfg.topic = b.dataset.topic; const l = buildList(); return startSession(l, "Assunto: " + T[cfg.topic].name); }
    if (b.dataset.opt != null) return answer(+b.dataset.opt);
    const a = b.dataset.act;
    if (a === "start") { const l = buildList(); const lab = { full: "Completo", top: "Rápido", topic: "Assunto: " + (T[cfg.topic] || {}).name, wrong: "Só as erradas" }[cfg.mode]; startSession(l, lab + (cfg.feedback === "prova" ? " · prova" : "")); }
    if (a === "next") { if (S.p === S.list.length - 1) finish(); else { S.p++; quiz(); window.scrollTo(0, 0); } }
    if (a === "prev") { if (S.p > 0) { S.p--; quiz(); window.scrollTo(0, 0); } }
    if (a === "redoWrong") { const l = S.list.filter((i) => S.ans[i] !== Q[i].a).map((i) => Q[i]); cfg.feedback = "treino"; startSession(shuffle(l), "Refazendo erradas"); }
    if (a === "reset") { if (confirm("Apagar todo o histórico desta matéria?")) { store = { q: {}, hist: [] }; save(); render(); } }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.name === "mode") { cfg.mode = t.value; setup(); }
    else if (t.name === "fb") { cfg.feedback = t.value; setup(); }
    else if (t.id === "tsel") cfg.topic = t.value;
    else if (t.id === "sq") cfg.sq = t.checked;
    else if (t.id === "so") cfg.so = t.checked;
  });

  // ---------- início ----------
  document.title = E.title + " · Simulado";
  document.documentElement.style.setProperty("--accent", E.color);
  $("#h-title").textContent = E.title;
  $("#h-sub").textContent = E.subtitle;
  render();
})();
</script>
</body></html>
